---
# Own the scalar top-level keys of ~/.codex/config.toml (model, reasoning
# effort, sandbox mode, ...) so they are versioned in this repo rather than
# living only on one laptop. lineinfile, not a deployed file: Codex rewrites
# config.toml at runtime ([projects] trust_level on every trusted directory,
# [marketplaces] last_updated, [mcp_servers.node_repl] paths that carry the
# ChatGPT.app build version), so a whole-file copy would fight the app.
# TOML requires top-level keys before the first table, hence insertbefore: BOF.

- name: "Codex settings — locate config.toml"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
  register: devbox_codex_settings_config
  tags: [codex, agents]

- name: "Codex settings — apply devbox-owned top-level keys"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    insertbefore: BOF
    create: false
    mode: "0600"
  loop: "{{ devbox_codex_settings }}"
  loop_control:
    label: "{{ item.key }}"
  when: devbox_codex_settings_config.stat.exists
  tags: [codex, agents]

- name: "Codex settings — report a missing config.toml instead of creating one"
  ansible.builtin.debug:
    msg: >-
      ~/.codex/config.toml not found — skipping devbox-owned Codex settings.
      Launch Codex once so it writes its initial config, then re-run.
  when: not devbox_codex_settings_config.stat.exists
  tags: [codex, agents]
