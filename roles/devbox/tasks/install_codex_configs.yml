---
# Deploy the portable Codex layer without replacing app-owned ~/.codex state.

- name: Resolve Codex config paths
  ansible.builtin.set_fact:
    devbox_codex_home: >-
      {{ (lookup('env', 'HOME') ~ '/.codex')
         if devbox_paths.dotfiles_root_dir == '~'
         else (devbox_paths.dotfiles_root_dir ~ '/.codex') }}
    devbox_codex_ai_config_home: >-
      {{ lookup('env', 'HOME')
         if devbox_paths.dotfiles_root_dir == '~'
         else devbox_paths.dotfiles_root_dir }}
    devbox_codex_repo_root: >-
      {{ (devbox_codex_role_path | default(role_path)) ~ '/../..' }}
    devbox_codex_skills_home: >-
      {{ (lookup('env', 'HOME') ~ '/.agents/skills')
         if devbox_paths.dotfiles_root_dir == '~'
         else (devbox_paths.dotfiles_root_dir ~ '/.agents/skills') }}
    devbox_codex_agents_home: >-
      {{ (lookup('env', 'HOME') ~ '/.codex/agents')
         if devbox_paths.dotfiles_root_dir == '~'
         else (devbox_paths.dotfiles_root_dir ~ '/.codex/agents') }}
  tags: [configs, ai, codex]

- name: Ensure Codex managed directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ devbox_codex_home }}", mode: "0700" }
    - { path: "{{ devbox_codex_agents_home }}", mode: "0700" }
    - { path: "{{ devbox_codex_skills_home }}", mode: "0755" }
  loop_control:
    label: "{{ item.path }}"
  tags: [configs, ai, codex]

- name: Apply repo-owned Codex settings through ai-config
  ansible.builtin.command:
    argv: >-
      {{ devbox_codex_ai_config_argv
         + (['--check'] if ansible_check_mode else []) }}
  register: devbox_codex_reconcile
  changed_when: >-
    devbox_codex_reconcile.rc == 0
    and (devbox_codex_reconcile.stdout | from_json).changed
  failed_when: devbox_codex_reconcile.rc != 0
  check_mode: false
  vars:
    devbox_codex_ai_config_argv:
      - "{{ devbox_codex_repo_root }}/scripts/ai-config"
      - apply
      - codex
      - --repo-root
      - "{{ devbox_codex_repo_root }}"
      - --home
      - "{{ devbox_codex_ai_config_home }}"
      - --profile
      - "{{ devbox_active_profile }}"
      - --json
  tags: [configs, codex]

- name: Install Codex Langfuse runtime configuration
  ansible.builtin.template:
    src: "{{ devbox_codex_role_path | default(role_path) }}/files/dot_codex/langfuse.json.j2"
    dest: "{{ devbox_codex_home }}/langfuse.json"
    mode: "0600"
  tags: [configs, ai, codex]

- name: Install Codex global authority protocol
  ansible.builtin.copy:
    src: "{{ devbox_codex_role_path | default(role_path) }}/files/dot_codex/AGENTS.md"
    dest: "{{ devbox_codex_home }}/AGENTS.md"
    mode: "0600"
  tags: [configs, ai, codex]

- name: Install Codex custom agents
  ansible.builtin.copy:
    src: >-
      {{ devbox_codex_role_path | default(role_path) }}/files/dot_codex/agents/{{ item }}.toml
    dest: "{{ devbox_codex_agents_home }}/{{ item }}.toml"
    mode: "0600"
  loop: "{{ devbox_codex_agents }}"
  loop_control:
    label: "{{ item }}"
  tags: [configs, ai, codex]

- name: Inspect managed Codex skill destinations
  ansible.builtin.stat:
    path: "{{ devbox_codex_skills_home }}/{{ item }}"
  loop: "{{ devbox_codex_shared_skills }}"
  register: devbox_codex_skill_destinations
  loop_control:
    label: "{{ item }}"
  tags: [configs, ai, codex]

- name: Remove stale symlinks at managed Codex skill destinations
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ devbox_codex_skill_destinations.results }}"
  when: item.stat.exists and item.stat.islnk
  loop_control:
    label: "{{ item.item }}"
  tags: [configs, ai, codex]

- name: Sync compatible shared skills to Codex
  ansible.posix.synchronize:
    src: "{{ devbox_codex_role_path | default(role_path) }}/files/dot_ai/skills/{{ item }}/"
    dest: "{{ devbox_codex_skills_home }}/{{ item }}/"
    delete: true
    recursive: true
    perms: true
    rsync_opts:
      - "--exclude=.DS_Store"
      - "--exclude=__pycache__"
      - "--exclude=.pytest_cache"
  delegate_to: localhost
  loop: "{{ devbox_codex_shared_skills }}"
  loop_control:
    label: "{{ item }}"
  tags: [configs, ai, codex]

- name: Ensure Codex managed bin directory exists
  ansible.builtin.file:
    path: "{{ devbox_codex_home }}/bin"
    state: directory
    mode: "0755"
  tags: [configs, ai, codex]

- name: Sync Codex bin directory
  ansible.posix.synchronize:
    src: "{{ devbox_codex_role_path | default(role_path) }}/files/dot_codex/bin/"
    dest: "{{ devbox_codex_home }}/bin/"
    delete: true
    recursive: true
    perms: true
  delegate_to: localhost
  tags: [configs, ai, codex]

- name: Find Codex CLI path
  ansible.builtin.command: "command -v codex"
  register: devbox_codex_cli_path
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [configs, ai, codex]

- name: Inspect configured Codex plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - marketplace
      - list
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  register: devbox_codex_marketplaces_before
  when: devbox_codex_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, ai, codex]

- name: Add pinned Codex plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - marketplace
      - add
      - "{{ item.repo }}"
      - --ref
      - "{{ item.ref }}"
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  loop: "{{ devbox_codex_plugin_marketplaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: devbox_codex_marketplaces_added
  when:
    - devbox_codex_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      item.name not in
      (devbox_codex_marketplaces_before.stdout | from_json).marketplaces
      | map(attribute='name') | list
  changed_when: true
  tags: [configs, ai, codex]

- name: Verify configured Codex plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - marketplace
      - list
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  register: devbox_codex_marketplaces_after
  when: devbox_codex_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, ai, codex]

- name: Inspect pinned Codex marketplace revisions
  ansible.builtin.command:
    argv:
      - git
      - -C
      - >-
        {{ ((devbox_codex_marketplaces_after.stdout | from_json).marketplaces
             | selectattr('name', 'equalto', item.name) | first).root }}
      - rev-parse
      - HEAD
  loop: "{{ devbox_codex_plugin_marketplaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: devbox_codex_marketplace_revisions
  when:
    - devbox_codex_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      item.name in
      ((devbox_codex_marketplaces_after.stdout | from_json).marketplaces
       | map(attribute='name') | list)
  changed_when: false
  tags: [configs, ai, codex]

- name: Assert Codex marketplaces resolve to their pinned revisions
  ansible.builtin.assert:
    that:
      - item.stdout == item.item.ref
    fail_msg: >-
      Codex marketplace {{ item.item.name }} resolved to {{ item.stdout }},
      expected {{ item.item.ref }}
  loop: "{{ devbox_codex_marketplace_revisions.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - not ansible_check_mode
    - not (item.skipped | default(false))
  tags: [configs, ai, codex]

- name: Inspect available Codex plugins
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - list
      - --available
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  register: devbox_codex_plugins_before
  when: devbox_codex_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, ai, codex]

- name: Install Codex plugins
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - add
      - "{{ item.name }}@{{ item.marketplace }}"
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  loop: "{{ devbox_codex_plugins }}"
  loop_control:
    label: "{{ item.name }}@{{ item.marketplace }}"
  register: devbox_codex_plugins_installed
  when:
    - devbox_codex_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      item.name ~ '@' ~ item.marketplace not in
      ((devbox_codex_plugins_before.stdout | from_json).installed
       | map(attribute='pluginId') | list)
  changed_when: true
  tags: [configs, ai, codex]

- name: Verify installed Codex plugins
  ansible.builtin.command:
    argv:
      - "{{ devbox_codex_cli_path.stdout }}"
      - plugin
      - list
      - --available
      - --json
  environment:
    CODEX_HOME: "{{ devbox_codex_home }}"
  register: devbox_codex_plugins_after
  when: devbox_codex_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, ai, codex]

- name: Assert required Codex plugins are installed and enabled
  ansible.builtin.assert:
    that:
      - >-
        item.name ~ '@' ~ item.marketplace in
        ((devbox_codex_plugins_after.stdout | from_json).installed
         | selectattr('enabled', 'equalto', true)
         | selectattr('version', 'equalto', item.version)
         | map(attribute='pluginId') | list)
    fail_msg: >-
      Codex plugin {{ item.name }}@{{ item.marketplace }} version {{ item.version }}
      is not installed and enabled
  loop: "{{ devbox_codex_plugins }}"
  loop_control:
    label: "{{ item.name }}@{{ item.marketplace }}"
  when:
    - devbox_codex_cli_path.rc == 0
    - not ansible_check_mode
  tags: [configs, ai, codex]
