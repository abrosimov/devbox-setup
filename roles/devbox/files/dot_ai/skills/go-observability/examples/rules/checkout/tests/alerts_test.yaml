---
rule_files:
  - ../alerts.yaml
  - ../recording.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate1h'
        values: '0.02x200'
      - series: 'sli:checkout_errors:ratio_rate5m'
        values: '0.02x200'
    alert_rule_test:
      - eval_time: 5m
        alertname: CheckoutErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              severity: page
              layer: product
              maturity: agreed
            exp_annotations:
              summary: "Checkout burning error budget at 14.4x (2% of the 30-day budget in 1h)"
              description: "1h error ratio 2% against SLO 99.9%"
              runbook_url: "https://runbooks.example/CheckoutErrorBudgetBurnFast"
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate1h'
        values: '0.0005x200'
      - series: 'sli:checkout_errors:ratio_rate5m'
        values: '0.0005x200'
    alert_rule_test:
      - eval_time: 5m
        alertname: CheckoutErrorBudgetBurnFast
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate6h'
        values: '0.01x200'
      - series: 'sli:checkout_errors:ratio_rate30m'
        values: '0.01x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CheckoutErrorBudgetBurnMedium
        exp_alerts:
          - exp_labels:
              severity: page
              layer: product
              maturity: agreed
            exp_annotations:
              summary: "Checkout burning error budget at 6x (5% of the 30-day budget in 6h)"
              description: "6h error ratio 1% against SLO 99.9%"
              runbook_url: "https://runbooks.example/CheckoutErrorBudgetBurnMedium"
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate6h'
        values: '0.0005x200'
      - series: 'sli:checkout_errors:ratio_rate30m'
        values: '0.0005x200'
    alert_rule_test:
      - eval_time: 30m
        alertname: CheckoutErrorBudgetBurnMedium
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate3d'
        values: '0.002x200'
      - series: 'sli:checkout_errors:ratio_rate6h'
        values: '0.002x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: CheckoutErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              severity: ticket
              layer: product
              maturity: agreed
            exp_annotations:
              summary: "Checkout consuming its error budget at 1x (10% of the 30-day budget in 3d)"
              description: "3d error ratio 0.2% against SLO 99.9%"
              runbook_url: "https://runbooks.example/CheckoutErrorBudgetBurnSlow"
  - interval: 1m
    input_series:
      - series: 'sli:checkout_errors:ratio_rate3d'
        values: '0.0005x200'
      - series: 'sli:checkout_errors:ratio_rate6h'
        values: '0.0005x200'
    alert_rule_test:
      - eval_time: 2h
        alertname: CheckoutErrorBudgetBurnSlow
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'messaging_client_consumed_messages_total{service_name="checkout",messaging_destination_name="orders",messaging_system="kafka"}'
        values: '100x30'
      - series: 'checkout_queue_depth{messaging_destination_name="orders"}'
        values: '7x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ConsumerStalled
        exp_alerts:
          - exp_labels:
              severity: page
              layer: technology
              messaging_destination_name: orders
            exp_annotations:
              summary: "Checkout consumer of orders has stalled"
              description: "No messages consumed for 10m while the queue orders is non-empty"
              runbook_url: "https://runbooks.example/ConsumerStalled"
  - interval: 1m
    input_series:
      - series: 'messaging_client_consumed_messages_total{service_name="checkout",messaging_destination_name="orders",messaging_system="kafka"}'
        values: '0+5x30'
      - series: 'checkout_queue_depth{messaging_destination_name="orders"}'
        values: '7x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: ConsumerStalled
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{container="checkout",pod="checkout-0"}'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 5m
        alertname: PodRestartLoop
        exp_alerts:
          - exp_labels:
              severity: page
              layer: technology
              container: checkout
              pod: checkout-0
            exp_annotations:
              summary: "checkout container restarting (checkout-0)"
              description: "5 restarts in the last hour"
              runbook_url: "https://runbooks.example/PodRestartLoop"
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_restarts_total{container="checkout",pod="checkout-0"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: PodRestartLoop
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/data",instance="db-1"}'
        values: '1000-10x400'
    alert_rule_test:
      - eval_time: 60m
        alertname: DiskRunwayShort
        exp_alerts:
          - exp_labels:
              severity: page
              layer: technology
              mountpoint: /data
              instance: db-1
            exp_annotations:
              summary: "/data on db-1 fills within an hour"
              description: "Linear projection of the last 6h crosses zero in under 3600s"
              runbook_url: "https://runbooks.example/DiskRunwayShort"
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{mountpoint="/data",instance="db-1"}'
        values: '100000-1x400'
    alert_rule_test:
      - eval_time: 60m
        alertname: DiskRunwayShort
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'checkout_panics_total{instance="a",error_type="runtime.boundsError"}'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 5m
        alertname: PanicsRecovered
        exp_alerts:
          - exp_labels:
              severity: ticket
              layer: code
              instance: a
              error_type: runtime.boundsError
            exp_annotations:
              summary: "checkout recovered a panic (runtime.boundsError)"
              description: "1 panics in 10m on a"
              runbook_url: "https://runbooks.example/PanicsRecovered"
  - interval: 1m
    input_series:
      - series: 'checkout_panics_total{instance="a",error_type="runtime.boundsError"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: PanicsRecovered
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'checkout_breaker_state{breaker="payments",state="open"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: CircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: ticket
              layer: code
              breaker: payments
              state: open
            exp_annotations:
              summary: "Breaker payments open for 5m"
              description: "Calls to payments are being short-circuited"
              runbook_url: "https://runbooks.example/CircuitBreakerOpen"
  - interval: 1m
    input_series:
      - series: 'checkout_breaker_state{breaker="payments",state="open"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: CircuitBreakerOpen
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'checkout_invariant_violations_total{invariant="INV-1"}'
        values: '0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: InvariantViolated
        exp_alerts:
          - exp_labels:
              severity: page
              layer: code
              invariant: INV-1
            exp_annotations:
              summary: "Runtime invariant INV-1 violated"
              description: "1 violations in 5m; the domain model's INV-1 no longer holds"
              runbook_url: "https://runbooks.example/InvariantViolated"
  - interval: 1m
    input_series:
      - series: 'checkout_invariant_violations_total{invariant="INV-1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: InvariantViolated
        exp_alerts: []
