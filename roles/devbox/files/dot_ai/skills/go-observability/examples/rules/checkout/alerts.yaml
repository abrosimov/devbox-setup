---
# Three layers for the checkout service. SLO 99.9 % availability on /checkout
# (error budget 0.001); burn rates for a 30-day window. SLIs come from
# recording.yaml. Every rule has a firing and a non-firing case in tests/.
groups:
  - name: checkout.product
    rules:
      - alert: CheckoutErrorBudgetBurnFast
        expr: |
          sli:checkout_errors:ratio_rate1h > (14.4 * 0.001)
          and
          sli:checkout_errors:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels: { severity: page, layer: product, maturity: agreed }
        annotations:
          summary: "Checkout burning error budget at 14.4x (2% of the 30-day budget in 1h)"
          description: "1h error ratio {{ $value | humanizePercentage }} against SLO 99.9%"
          runbook_url: https://runbooks.example/CheckoutErrorBudgetBurnFast
      - alert: CheckoutErrorBudgetBurnMedium
        expr: |
          sli:checkout_errors:ratio_rate6h > (6 * 0.001)
          and
          sli:checkout_errors:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels: { severity: page, layer: product, maturity: agreed }
        annotations:
          summary: "Checkout burning error budget at 6x (5% of the 30-day budget in 6h)"
          description: "6h error ratio {{ $value | humanizePercentage }} against SLO 99.9%"
          runbook_url: https://runbooks.example/CheckoutErrorBudgetBurnMedium
      - alert: CheckoutErrorBudgetBurnSlow
        expr: |
          sli:checkout_errors:ratio_rate3d > (1 * 0.001)
          and
          sli:checkout_errors:ratio_rate6h > (1 * 0.001)
        for: 1h
        labels: { severity: ticket, layer: product, maturity: agreed }
        annotations:
          summary: "Checkout consuming its error budget at 1x (10% of the 30-day budget in 3d)"
          description: "3d error ratio {{ $value | humanizePercentage }} against SLO 99.9%"
          runbook_url: https://runbooks.example/CheckoutErrorBudgetBurnSlow

  - name: checkout.technology
    rules:
      - alert: ConsumerStalled
        expr: |
          sum by (messaging_destination_name) (
            rate(messaging_client_consumed_messages_total{service_name="checkout"}[10m])
          ) == 0
          and on (messaging_destination_name)
          checkout_queue_depth > 0
        for: 10m
        labels: { severity: page, layer: technology }
        annotations:
          summary: "Checkout consumer of {{ $labels.messaging_destination_name }} has stalled"
          description: >-
            No messages consumed for 10m while the queue
            {{ $labels.messaging_destination_name }} is non-empty
          runbook_url: https://runbooks.example/ConsumerStalled
      - alert: PodRestartLoop
        expr: increase(kube_pod_container_status_restarts_total{container="checkout"}[1h]) > 3
        labels: { severity: page, layer: technology }
        annotations:
          summary: "checkout container restarting ({{ $labels.pod }})"
          description: "{{ $value }} restarts in the last hour"
          runbook_url: https://runbooks.example/PodRestartLoop
      - alert: DiskRunwayShort
        expr: predict_linear(node_filesystem_avail_bytes{mountpoint="/data"}[6h], 3600) < 0
        for: 15m
        labels: { severity: page, layer: technology }
        annotations:
          summary: "/data on {{ $labels.instance }} fills within an hour"
          description: "Linear projection of the last 6h crosses zero in under 3600s"
          runbook_url: https://runbooks.example/DiskRunwayShort

  - name: checkout.code
    rules:
      - alert: PanicsRecovered
        expr: increase(checkout_panics_total[10m]) > 0
        labels: { severity: ticket, layer: code }
        annotations:
          summary: "checkout recovered a panic ({{ $labels.error_type }})"
          description: "{{ $value }} panics in 10m on {{ $labels.instance }}"
          runbook_url: https://runbooks.example/PanicsRecovered
      - alert: CircuitBreakerOpen
        expr: checkout_breaker_state{state="open"} == 1
        for: 5m
        labels: { severity: ticket, layer: code }
        annotations:
          summary: "Breaker {{ $labels.breaker }} open for 5m"
          description: "Calls to {{ $labels.breaker }} are being short-circuited"
          runbook_url: https://runbooks.example/CircuitBreakerOpen
      - alert: InvariantViolated
        expr: increase(checkout_invariant_violations_total[5m]) > 0
        labels: { severity: page, layer: code }
        annotations:
          summary: "Runtime invariant {{ $labels.invariant }} violated"
          description: "{{ $value }} violations in 5m; the domain model's {{ $labels.invariant }} no longer holds"
          runbook_url: https://runbooks.example/InvariantViolated
