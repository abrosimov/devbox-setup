name: brew-audit

# Periodic supply-chain audit of the Homebrew package set managed by this repo.
# Uses `brew vulns` (built into Homebrew core since it was merged from the now
# archived Homebrew/brew-vulns tap, queries OSV.dev) to scan the package set
# declared in roles/devbox/defaults/main/packages.yml plus the personal profile
# extras. The merged command dropped SARIF output, so this workflow is a plain
# pass/fail gate: it prints the full report to the job log and fails on any open
# high-severity (or above) finding.
#
# Why a separate workflow from ci.yml: needs a macOS runner (Homebrew). ci.yml
# is Ubuntu.

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Random offset would be ideal but GH Actions
    # cron is on the minute — no jitter built in.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "roles/devbox/defaults/main/packages.yml"
      - "profiles/*.yml"
      - ".github/workflows/brew-audit.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: brew-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brew-vulns:
    name: Brew CVE scan (OSV via brew-vulns)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Homebrew (brew vulns is a built-in command)
        run: brew update

      - name: Generate Brewfile from repo declarations
        run: |
          make audit-brewfile > Brewfile.audit
          echo "--- Brewfile.audit ---"
          cat Brewfile.audit

      # Tap-sourced packages (sketchybar, borders, …) do not resolve on a clean
      # runner until their taps are added; the generated Brewfile carries the
      # declared taps as `tap "..."` lines but neither `brew info` nor
      # `brew vulns` acts on them. Homebrew 6.0 additionally refuses to load
      # formulae from untrusted third-party taps (HOMEBREW_REQUIRE_TAP_TRUST is
      # on by default), so each tap is trusted right after it is added — the
      # same whole-tap trust the playbook grants in
      # roles/devbox/tasks/darwin/install_from_brew_secondary.yml.
      - name: Tap and trust declared third-party repositories
        run: |
          rc=0
          while read -r tap; do
            brew tap "$tap" && brew trust --tap "$tap" \
              || { echo "::error::tap $tap: could not be added or trusted"; rc=1; }
          done < <(sed -nE 's/^tap "([^"]+)".*/\1/p' Brewfile.audit)
          exit "$rc"

      # Parse-check every declared formula/cask against fresh definitions (brew
      # was updated above). Catches removed/renamed packages and upstream-broken
      # definitions before they fail a real `make personal`.
      - name: Resolve declared package definitions
        run: |
          rc=0
          while read -r kind name; do
            brew info "--$kind" "$name" >/dev/null 2>/tmp/brew-info-err \
              || { echo "::error::$kind $name: $(cat /tmp/brew-info-err)"; rc=1; }
          done < <(sed -nE -e 's/^brew "([^"]+)".*/formula \1/p' -e 's/^cask "([^"]+)".*/cask \1/p' Brewfile.audit)
          exit "$rc"

      - name: Run brew vulns (full report)
        run: |
          # Full report across all severities for the job log. `|| true` so the
          # gate step below — not this one — decides the job's pass/fail state.
          # `--brewfile` only takes a path via `=`; a space-separated value is
          # parsed as a formula name and the flag falls back to ./Brewfile.
          brew vulns --brewfile=Brewfile.audit --json || true

      - name: Fail on high-severity vulnerabilities
        run: |
          # `brew vulns` exits non-zero when any open finding at or above the
          # requested severity is present. This is the pass/fail gate.
          brew vulns --brewfile=Brewfile.audit --severity high
