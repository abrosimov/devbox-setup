---
# Managed .claude subdirectories. Each is rsynced one-way from the repo to
# ~/.claude/<dir>/ with --delete scoped to that subdir, so host-side scratch
# state under ~/.claude/ (projects/, plans/, memory/, plugins/, ...) is untouched.
# Root files (CLAUDE.md, config.md) are copied separately; settings.json.j2 — which
# carries the hooks block — is rendered and reconciled by
# `scripts/ai-config apply claude`.
# future_projects/ is intentionally absent: it is a host-only working area.
devbox_ai_managed_dirs:
  - agents
  - commands
  - skills

devbox_claude_managed_dirs:
  - schemas
  - bin
  - docs
  - marketplaces
  - templates
  - output-styles

# Subdirs that were in devbox_claude_managed_dirs once and are not any more.
# The legacy deploy scheme symlinked every managed subdir into the repo; the
# stale-symlink sweep in install_configs.yml only inspects the current list, so
# a subdir that leaves the list keeps its symlink on every machine that ran the
# old scheme. Listing it here keeps it in the sweep — nothing else. Entries are
# permanent (removing one resurrects the leak) and cost one stat per run. Only
# symlinks are removed: a real ~/.claude/<dir>/ is the operator's own work.
devbox_claude_unmanaged_dirs:
  - future_projects

# MCP servers registered via `claude mcp add` (written to ~/.claude.json under
# the `mcpServers` key, user scope). Grouped by transport type for clarity.
# The reconciler step in apply_configs.yml removes any user-scope MCP server
# not listed below, so these lists are the single source of truth.
devbox_mcp_docker_servers:
  - name: sequentialthinking
    image: mcp/sequentialthinking
    network: none
    read_only: true
  - name: playwright
    image: mcr.microsoft.com/playwright/mcp
    init: true
  - name: context7
    image: mcp/context7
    env:
      MCP_TRANSPORT: stdio

# Empty by default. memory-upstream / memory-downstream were removed
# 2026-06-20 — the file-based memory system in ~/.claude/memory/ replaces
# the graph-MCP approach.
devbox_mcp_script_servers: []

# figma was removed 2026-06-20 — design work goes through the figma plugin /
# web app instead. devbox_extra_mcp_http_servers (set per profile) still
# provides an extension point (e.g. atlassian on the work profile).
# fpf (https://mcp.fpf.tools/mcp) was removed 2026-10-18: its `search` tool
# ships the wording of the live question to a third-party server, so the
# fpf-thinking skill reads the vendored references instead. The reconciler below
# deregisters it from user scope on the next run.
devbox_mcp_http_servers: []

# Claude Code plugins installed via `claude plugin` CLI.
# Marketplaces are GitHub repos containing plugin manifests.
# Plugins are installed from marketplaces by name.
#
# The Langfuse observability plugin used to be installed here. Its hook resolved
# `langfuse>=4.0,<5` at invocation time through `uv run --script`, which puts the
# environment under UV_CACHE_DIR (/tmp, so uv stays writable in the Bash sandbox)
# where macOS tmp_cleaner erodes it after three days. The hook is now vendored at
# files/dot_claude/bin/vendor/langfuse_hook.py, pinned in bin/uv.lock and invoked
# from the same pre-materialised venv as every other hook. See bin/vendor/README.md.
devbox_claude_plugin_marketplaces:
  - repo: anthropics/skills
    name: anthropic-agent-skills
    declare_in_settings: true

devbox_claude_plugins:
  - name: example-skills
    marketplace: anthropic-agent-skills
  - name: document-skills
    marketplace: anthropic-agent-skills
  # LSP plugins — installed from official marketplace (pre-registered on macOS).
  # Binaries must be on PATH: gopls (go install), typescript-language-server (npm).
  # No Python LSP plugin here: pyrefly is the sole type checker (see
  # devbox_packages.uv_tools in packages.yml) but has no LSP plugin yet — one is
  # being built in a separate repository and will be wired in later.
  - name: gopls-lsp
  - name: typescript-lsp
  # The official Langfuse skill. The marketplace is explicit because a bare
  # `claude plugin install langfuse` resolves to the claude.ai
  # anthropic-plugin-directory copy, not this one. Its API keys and host are
  # per profile (devbox_langfuse_host, make langfuse-config).
  - name: langfuse
    marketplace: claude-plugins-official
