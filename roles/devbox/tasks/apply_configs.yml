---
# `become` is conditional on devbox_skip_become so slim maintenance playbooks
# (make shell-push, make mcp-sync) can opt out of the sudo prompt. The full
# main.yml playbook leaves the default in place, preserving the existing
# defensive `become_user: <login user>` behaviour.

- name: Find fish shell path
  ansible.builtin.command: "command -v fish"
  register: devbox_fish_shell_path
  changed_when: false
  check_mode: false
  failed_when: devbox_fish_shell_path.rc != 0
  tags: [configs, shell]

- name: Find fc-cache path
  ansible.builtin.command: "command -v fc-cache"
  register: devbox_fc_cache_path
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [configs, shell]

- name: Regenerate font cache for user directories
  ansible.builtin.command: >-
    {{ devbox_fc_cache_path.stdout }} -f
    {{ ansible_facts['env']['HOME'] }}/Library/Fonts
    {{ ansible_facts['env']['HOME'] }}/.local/share/fonts
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_fc_cache_path.rc == 0
  changed_when: false
  failed_when: false
  tags: [configs, shell]

- name: "Migration: remove pinned tide@v6 before unpinned install"
  ansible.builtin.shell: "{{ devbox_fish_shell_path.stdout }} -c 'fisher remove ilancosman/tide@v6'"
  args:
    executable: /bin/bash
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  changed_when: false
  failed_when: false
  tags: [configs, shell]

- name: Install fisher plugins
  ansible.builtin.shell: "{{ devbox_fish_shell_path.stdout }} -c 'fisher install {{ item }}'"
  args:
    executable: /bin/bash
  loop: "{{ devbox_fish_plugins }}"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  changed_when: false
  tags: [configs, shell]

- name: Update fisher plugins
  ansible.builtin.shell: "{{ devbox_fish_shell_path.stdout }} -c 'fisher update'"
  args:
    executable: /bin/bash
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  changed_when: false
  tags: [configs, shell]

- name: Configure tide prompt (auto mode)
  ansible.builtin.shell: "{{ devbox_fish_shell_path.stdout }} -c '{{ devbox_tide_configure_auto }}'"
  args:
    executable: /bin/bash
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  changed_when: false
  tags: [configs, shell]

# --- macOS GUI-tool launchd services ---

# JankyBorders runs as a per-user launchd service (state=present == started,
# idempotent). AeroSpace has no after-startup-command, so borders is brought up
# independently here rather than by the WM. Darwin-only:
# apply_configs.yml is shared with the Linux path, where there is no brew/borders.
- name: Start JankyBorders as a launchd service
  community.general.homebrew_services:
    name: borders
    state: present
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  when: ansible_facts['os_family'] == "Darwin"
  tags: [configs, macos]

# `start-at-login = true` in aerospace.toml only registers the login item once
# AeroSpace itself has run, so a machine that never launched it would never get
# the WM. Launching it here closes that gap; later logins start it on their own.
# Skipped in dev_mode, which must not touch the live session.
- name: Check whether AeroSpace is running
  ansible.builtin.command: pgrep -x AeroSpace
  register: devbox_aerospace_running
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not (dev_mode | default(false) | bool)
  tags: [configs, macos]

- name: Launch AeroSpace so it registers itself as a login item
  ansible.builtin.command: open -a AeroSpace
  changed_when: true
  when:
    - ansible_facts['os_family'] == "Darwin"
    - not (dev_mode | default(false) | bool)
    - devbox_aerospace_running.rc != 0
  tags: [configs, macos]

# --- MCP servers data directories ---

- name: Create MCP memory data directory
  ansible.builtin.file:
    path: "{{ devbox_paths.dotfiles_root_dir }}/.claude/memory"
    state: directory
    mode: "0755"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  tags: [configs, mcp]

# --- Claude Code MCP servers ---
# Registered via `claude mcp add-json --scope user` → writes to ~/.claude.json.
# settings.json is for permissions/sandbox only, not MCP servers.

- name: Find Claude Code CLI path
  ansible.builtin.command: "command -v claude"
  register: devbox_claude_cli_path
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [configs, claude, mcp]

- name: Inspect configured Claude Code plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - marketplace
      - list
      - --json
  register: devbox_claude_marketplaces_before
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, claude]

- name: Add Claude Code plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - marketplace
      - add
      - >-
        {{ item.repo
           if item.repo is defined
           else ((lookup('env', 'HOME')
                  if devbox_paths.dotfiles_root_dir == '~'
                  else devbox_paths.dotfiles_root_dir)
                 ~ '/.claude/' ~ item.path) }}
      - --scope
      - user
  loop: "{{ devbox_claude_plugin_marketplaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: devbox_claude_marketplaces_added
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      item.name not in
      (devbox_claude_marketplaces_before.stdout | from_json
       | map(attribute='name') | list)
  changed_when: true
  tags: [configs, claude]

- name: Verify configured Claude Code plugin marketplaces
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - marketplace
      - list
      - --json
  register: devbox_claude_marketplaces_after
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, claude]

- name: Assert required Claude Code plugin marketplaces are configured
  ansible.builtin.assert:
    that:
      - >-
        item.name in
        (devbox_claude_marketplaces_after.stdout | from_json
         | map(attribute='name') | list)
    fail_msg: "Claude Code plugin marketplace {{ item.name }} is not configured"
  loop: "{{ devbox_claude_plugin_marketplaces }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
  tags: [configs, claude]

- name: Inspect installed Claude Code plugins
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - list
      - --json
  register: devbox_claude_plugins_before
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, claude]

# A marketplace is cloned once, at registration, and refreshed only when Claude
# Code itself decides to; a plugin published after that clone is "not found".
# Refresh only the marketplace a missing plugin comes from, so a converged run
# makes no network calls.
- name: Refresh the marketplace of each Claude Code plugin not installed yet
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - marketplace
      - update
      - "{{ item.marketplace | default('claude-plugins-official') }}"
  loop: "{{ devbox_claude_plugins + devbox_extra_claude_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      (item.name ~ '@' ~ (item.marketplace | default('claude-plugins-official')))
      not in
      (devbox_claude_plugins_before.stdout | from_json
       | map(attribute='id') | list)
  changed_when: true
  tags: [configs, claude]

- name: Install Claude Code plugins (user scope)
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - install
      - >-
        {{ item.name ~ '@' ~ item.marketplace
           if item.marketplace is defined else item.name }}
      - --scope
      - user
  loop: "{{ devbox_claude_plugins + devbox_extra_claude_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  register: devbox_claude_plugins_installed
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      (item.name ~ '@' ~ (item.marketplace | default('claude-plugins-official')))
      not in
      (devbox_claude_plugins_before.stdout | from_json
       | map(attribute='id') | list)
  changed_when: true
  tags: [configs, claude]

- name: Inspect Claude Code plugins after installation
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - list
      - --json
  register: devbox_claude_plugins_after_install
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, claude]

- name: Enable Claude Code plugins (user scope)
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - enable
      - >-
        {{ item.name ~ '@' ~ item.marketplace
           if item.marketplace is defined else item.name }}
      - --scope
      - user
  loop: "{{ devbox_claude_plugins + devbox_extra_claude_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  register: devbox_claude_plugins_enabled
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
    - >-
      not (
        devbox_claude_plugins_after_install.stdout | from_json
        | selectattr(
            'id', 'equalto',
            item.name ~ '@' ~ (item.marketplace | default('claude-plugins-official'))
          )
        | map(attribute='enabled') | first | default(false)
      )
  changed_when: true
  tags: [configs, claude]

- name: Verify installed Claude Code plugins
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - plugin
      - list
      - --json
  register: devbox_claude_plugins_after
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  tags: [configs, claude]

- name: Assert required Claude Code plugins are installed and enabled
  ansible.builtin.assert:
    that:
      - >-
        item.name ~ '@' ~ (item.marketplace | default('claude-plugins-official'))
        in
        (devbox_claude_plugins_after.stdout | from_json
         | selectattr('enabled', 'equalto', true)
         | map(attribute='id') | list)
    fail_msg: >-
      Claude Code plugin
      {{ item.name }}@{{ item.marketplace | default('claude-plugins-official') }}
      is not installed and enabled
  loop: "{{ devbox_claude_plugins + devbox_extra_claude_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - not ansible_check_mode
  tags: [configs, claude]

# Every declared server is registered with `claude mcp add-json`, which stores
# the given JSON verbatim under `mcpServers` in ~/.claude.json, so the declared
# spec compares exactly with the registered one. `add-json` refuses a name that
# already exists, so a server whose declared spec changed (a new URL, image or
# flag) is removed first and then added again; an unchanged one is left alone,
# which keeps its OAuth session. add-json rather than add also because only the
# JSON form carries `headersHelper`, which resolves a bearer token at connect
# time so it never lands in ~/.claude.json.
- name: Build declared Claude Code MCP server specs
  ansible.builtin.set_fact:
    devbox_mcp_declared: >-
      {%- set specs = {} -%}
      {%- for s in devbox_mcp_docker_servers -%}
        {%- set args = ['run', '--rm', '-i'] -%}
        {%- if s.network is defined -%}{%- set args = args + ['--network=' ~ s.network] -%}{%- endif -%}
        {%- if s.read_only | default(false) -%}{%- set args = args + ['--read-only'] -%}{%- endif -%}
        {%- if s.init | default(false) -%}{%- set args = args + ['--init'] -%}{%- endif -%}
        {%- set env_args = [] -%}
        {%- for k, v in (s.env | default({})).items() -%}
          {%- set _ = env_args.extend(['-e', k ~ '=' ~ v]) -%}
        {%- endfor -%}
        {%- set spec = {'type': 'stdio', 'command': 'docker', 'args': args + env_args + [s.image], 'env': {}} -%}
        {%- set _ = specs.update({s.name: spec}) -%}
      {%- endfor -%}
      {%- for s in devbox_mcp_script_servers -%}
        {%- set words = s.command.split() -%}
        {%- set _ = specs.update({s.name: {'type': 'stdio', 'command': words[0], 'args': words[1:], 'env': {}}}) -%}
      {%- endfor -%}
      {%- for s in devbox_mcp_http_servers + devbox_extra_mcp_http_servers -%}
        {%- set spec = {'type': s.transport | default('http'), 'url': s.url} -%}
        {%- if s.headers_helper is defined -%}
          {%- set spec = spec | combine({'headersHelper': s.headers_helper}) -%}
        {%- endif -%}
        {%- set _ = specs.update({s.name: spec}) -%}
      {%- endfor -%}
      {{ specs | to_json }}
  when: devbox_claude_cli_path.rc == 0
  tags: [configs, claude, mcp]

- name: Read registered Claude Code MCP servers (user scope)
  ansible.builtin.slurp:
    path: "~{{ devbox_user.login }}/.claude.json"
  register: devbox_claude_json_raw
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  check_mode: false
  failed_when: false
  tags: [configs, claude, mcp]

- name: Parse registered Claude Code MCP servers
  ansible.builtin.set_fact:
    devbox_mcp_registered: >-
      {{ ((devbox_claude_json_raw.content | b64decode | from_json).mcpServers | default({}))
         if (devbox_claude_json_raw.content is defined) else {} }}
  when: devbox_claude_cli_path.rc == 0
  tags: [configs, claude, mcp]

- name: Compute MCP servers whose registered spec differs from the declared one
  ansible.builtin.set_fact:
    devbox_mcp_to_replace: >-
      {%- set out = [] -%}
      {%- for name, spec in (devbox_mcp_declared | from_json).items() -%}
        {%- if name in devbox_mcp_registered and devbox_mcp_registered[name] != spec -%}
          {%- set _ = out.append(name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}
  when: devbox_claude_cli_path.rc == 0
  tags: [configs, claude, mcp]

- name: Remove MCP servers whose declared spec changed (user scope)
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - mcp
      - remove
      - --scope
      - user
      - "{{ item }}"
  loop: "{{ devbox_mcp_to_replace | from_json }}"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: true
  tags: [configs, claude, mcp]

- name: Register missing or changed Claude Code MCP servers (user scope)
  ansible.builtin.command:
    argv:
      - "{{ devbox_claude_cli_path.stdout }}"
      - mcp
      - add-json
      - --scope
      - user
      - "{{ item.key }}"
      - "{{ item.value | to_json }}"
  loop: >-
    {{ devbox_mcp_declared | from_json | dict2items
       | rejectattr('key', 'in',
           devbox_mcp_registered.keys() | list | difference(devbox_mcp_to_replace | from_json))
       | list }}
  loop_control:
    label: "{{ item.key }}"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: true
  tags: [configs, claude, mcp]

# Reconciler: anything registered at user scope that is NOT in the declared
# union above gets removed. Makes defaults/main/claude.yml the single source
# of truth for MCP servers — drop an entry from the YAML and the next
# `make mcp-sync` (or full playbook) will deregister it.
#
# `claude mcp list` prints `<name>: <command-or-url> - <status>` per line
# plus a header. Names may contain spaces and dots (e.g. "claude.ai Gmail"),
# so we match everything up to the first `:`. Servers prefixed with
# "claude.ai " are auto-registered by Claude Code itself (Anthropic-managed
# Gmail/Drive/Calendar integrations) — they get re-added automatically, so
# removing them would just churn. The reject() filter excludes them.
- name: List currently registered MCP servers (user scope)
  ansible.builtin.command: "{{ devbox_claude_cli_path.stdout }} mcp list"
  register: devbox_mcp_current_raw
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when: devbox_claude_cli_path.rc == 0
  changed_when: false
  check_mode: false
  failed_when: false
  tags: [configs, claude, mcp]

- name: Compute MCP reconciler diff (registered - declared - auto-managed)
  ansible.builtin.set_fact:
    devbox_mcp_to_remove: >-
      {{ (devbox_mcp_current_raw.stdout_lines | default([])
          | select('match', '^[^:]+:\s')
          | map('regex_replace', '^([^:]+?):\s.*$', '\1')
          | reject('match', '^claude\.ai ')
          | list)
         | difference(
             (devbox_mcp_docker_servers
              + devbox_mcp_script_servers
              + devbox_mcp_http_servers
              + devbox_extra_mcp_http_servers)
             | map(attribute='name') | list) }}
  when: devbox_claude_cli_path.rc == 0
  tags: [configs, claude, mcp]

- name: Remove undeclared MCP servers (user scope)
  ansible.builtin.command: >
    {{ devbox_claude_cli_path.stdout }} mcp remove {{ item }} --scope user
  loop: "{{ devbox_mcp_to_remove | default([]) }}"
  become: "{{ not (devbox_skip_become | default(false)) }}"
  become_user: "{{ devbox_user.login }}"
  when:
    - devbox_claude_cli_path.rc == 0
    - devbox_mcp_to_remove | default([]) | length > 0
  changed_when: true
  failed_when: false
  tags: [configs, claude, mcp]
