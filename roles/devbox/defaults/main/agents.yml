---
# Settings for third-party coding agents whose config file lives outside this
# repo's deployment tree and is mutated by the app itself — Codex rewrites
# ~/.codex/config.toml on every trust prompt and plugin update. We therefore
# own individual keys, never the whole file. See
# tasks/darwin/configure_codex_settings.yml and configure_codex_telemetry.yml.

# Scalar top-level keys devbox owns in ~/.codex/config.toml. Applied with
# lineinfile (replace-or-insert), NOT blockinfile: the keys already exist as
# bare lines in a live config, and a marked block would duplicate them, which
# is a TOML load error. Tables ([projects], [marketplaces], [mcp_servers],
# [plugins], [desktop]) stay app-owned and are deliberately not listed.
devbox_codex_settings:
  - key: personality
    value: '"pragmatic"'
  - key: model
    value: '"gpt-5.6-sol"'
  - key: model_reasoning_effort
    value: '"xhigh"'
  - key: service_tier
    value: '"default"'
  - key: sandbox_mode
    value: '"workspace-write"'
