---
# `check_mode: false` on tap + trust steps is intentional. Without it, a
# dry-run (`make check-personal`/`make check-work`) silently skips both, and
# any subsequent `brew install` of a formula from a newly-declared tap then
# fails with "No available formula or cask with the name ...". Tap and trust
# are idempotent and easily reversible (`brew untap`, manual edit of brew
# trust manifest), so executing them during a dry-run is acceptable — the
# alternative is a check that lies about what a real run would do.
- name: "Tap third-party Homebrew repositories"
  community.general.homebrew_tap:
    name: "{{ devbox_brew_taps }}"
    state: present
  check_mode: false

# Homebrew 6.0 (HOMEBREW_REQUIRE_TAP_TRUST, on by default) refuses to load
# formulae from un-trusted third-party taps — *any* untrusted tap aborts any
# `brew install`/`brew update`, even if we are not installing from it, because
# brew enumerates all tapped repos when computing dependencies. So we must
# trust the full set of tapped non-official repos, not just devbox_brew_taps.
#
# The sweep approach (enumerate `brew tap`, skip homebrew/core + homebrew/cask)
# tolerates latent state from past experiments: as long as a tap is on the
# machine, it gets trusted. `make audit-taps` reports strays so the user can
# decide to untap (via `make untap-stale`) or declare.
#
# There is no community.general `homebrew_trust` module as of 13.0.0, so trust
# is granted via the brew CLI directly. Whole-tap trust (not --formula) because
# Homebrew rejects --formula for custom remotes (#22685).
- name: "Read Homebrew trust manifest"
  ansible.builtin.command: brew trust --json v1
  register: devbox_brew_trust_state
  changed_when: false
  check_mode: false

- name: "Enumerate all currently tapped Homebrew repositories"
  ansible.builtin.command: brew tap
  register: devbox_brew_tapped_list
  changed_when: false
  check_mode: false

- name: "Trust all non-official tapped Homebrew repositories"
  ansible.builtin.command:
    cmd: "brew trust --tap {{ item }}"
  loop: "{{ devbox_brew_tapped_list.stdout_lines | reject('match', '^homebrew/(core|cask)$') | list }}"
  when: (item | lower) not in (devbox_brew_trust_state.stdout | lower)
  changed_when: true
  check_mode: false  # see comment on the tap task above

- name: "Install Homebrew apps"
  community.general.homebrew:
    name: "{{ devbox_brew_secondary + devbox_extra_brew }}"
    state: "{{ 'latest' if devbox_upgrade_mode | default(true) | bool else 'present' }}"

- name: "Install Homebrew apps kept at latest"
  community.general.homebrew:
    name: "{{ devbox_brew_always_latest }}"
    state: latest

# Migration cleanup: goreleaser moved to the `goreleaser-pro` cask, which ships
# the same `goreleaser` binary. Homebrew refuses to install it while the old
# `goreleaser` formula/cask still owns /opt/homebrew/bin/goreleaser, and
# `state: present` never removes a dropped package — so strip both here.
# No-ops once migrated.
- name: "Remove superseded goreleaser formula (replaced by goreleaser-pro cask)"
  community.general.homebrew:
    name: goreleaser
    state: absent

- name: "Remove superseded goreleaser cask (replaced by goreleaser-pro cask)"
  community.general.homebrew_cask:
    name: goreleaser
    state: absent

# Migration cleanup: OpenAI discontinued the standalone Codex desktop app and
# folded it into the unified ChatGPT desktop app (`chatgpt` cask). Homebrew
# deprecated the cask on 2026-07-12 and disables it on 2027-07-12, at which
# point a machine that still has it installed cannot upgrade it. The `codex`
# CLI cask is a separate package and stays. No-op once removed.
- name: "Remove discontinued codex-app cask (folded into the chatgpt app)"
  community.general.homebrew_cask:
    name: codex-app
    state: absent

# Migration cleanup: pub mode used to run a local `gost` HTTP-to-SOCKS bridge
# on 127.0.0.1:8080; it now uses WARP's `tunnel_only` mode and never starts a
# bridge, so the formula is dead weight. `state: present` never removes a
# package dropped from devbox_brew_secondary, so strip it here. No-op once
# removed.
- name: "Remove superseded gost formula (pub mode now uses WARP tunnel_only)"
  community.general.homebrew:
    name: gost
    state: absent

- name: "Install Homebrew casks"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_secondary_casks + devbox_extra_brew_casks }}"
    state: present
    install_options: 'adopt'
    upgrade_all: false
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true   # Prevents the sudo password leaking into -v / -vvv output.
  register: devbox_cask_secondary_result
  failed_when:
    - devbox_cask_secondary_result.failed is defined
    - devbox_cask_secondary_result.failed
    - '"already installed" not in devbox_cask_secondary_result.msg'

# A separate task because the module hands install_options to `brew upgrade`
# too, and `brew upgrade` rejects `--adopt`. Every cask is installed by now, so
# this only upgrades the outdated ones. Not greedy: casks that update
# themselves are left to do so. Retried because a transient 5xx from a vendor's
# download host (e.g. GitHub releases) would otherwise fail the whole run.
- name: "Upgrade Homebrew casks"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_secondary_casks + devbox_extra_brew_casks }}"
    state: latest
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true   # Prevents the sudo password leaking into -v / -vvv output.
  register: devbox_cask_secondary_upgrade_result
  until: devbox_cask_secondary_upgrade_result is succeeded
  retries: 3
  delay: 30
  when: devbox_upgrade_mode | default(true) | bool

# Migration cleanup: Claude Code used to be installed by scripts/init.sh through
# Anthropic's native installer, which leaves a launcher at ~/.local/bin/claude
# pointing into ~/.local/share/claude/versions/. The claude-code@latest cask now
# owns the binary, but devbox_shell.path_prepend puts ~/.local/bin ahead of
# /opt/homebrew/bin, so a surviving native launcher silently shadows the cask and
# the two versions drift apart — Anthropic documents exactly this as a
# conflicting installation. Nothing here touches configuration: the native
# install keeps only binaries under ~/.local/share/claude, while settings and
# history live in ~/.claude.
- name: Check whether the Claude Code cask has provided its binary
  ansible.builtin.stat:
    path: /opt/homebrew/bin/claude
  register: devbox_claude_brew_binary

# Guarded on the cask's binary rather than on the task result above, so the
# native install is never removed before its replacement is actually on disk —
# a machine must not be left with no `claude` at all.
- name: "Remove the superseded native Claude Code install (the cask owns it now)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ devbox_paths.dotfiles_root_dir }}/.local/bin/claude"
    - "{{ devbox_paths.dotfiles_root_dir }}/.local/share/claude"
  when: devbox_claude_brew_binary.stat.exists

# Separate task for casks whose post-install `xattr -w` step fails because the
# .pkg lays down root-owned files inside /Applications/<App>.app. Adding
# `no-binaries` skips brew's shim+Spotlight-metadata step entirely; the cask
# itself still installs and the vendor installer creates its own CLI symlinks.
# Shared base + per-profile extras, mirroring the main cask task above.
- name: "Install Homebrew casks (no-binaries variant)"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_secondary_casks_no_binaries + devbox_extra_brew_casks_no_binaries }}"
    state: present
    install_options:
      - adopt
      - no-binaries
    upgrade_all: false
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true
  when: (devbox_brew_secondary_casks_no_binaries + devbox_extra_brew_casks_no_binaries) | length > 0
  register: devbox_cask_no_binaries_result
  failed_when:
    - devbox_cask_no_binaries_result.failed is defined
    - devbox_cask_no_binaries_result.failed
    - '"already installed" not in devbox_cask_no_binaries_result.msg'

# `--no-binaries` is valid for `brew upgrade` as well; `--adopt` is not.
# Retried for the same transient-download reason as the main upgrade task.
- name: "Upgrade Homebrew casks (no-binaries variant)"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_secondary_casks_no_binaries + devbox_extra_brew_casks_no_binaries }}"
    state: latest
    install_options:
      - no-binaries
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true
  register: devbox_cask_no_binaries_upgrade_result
  until: devbox_cask_no_binaries_upgrade_result is succeeded
  retries: 3
  delay: 30
  when:
    - devbox_upgrade_mode | default(true) | bool
    - (devbox_brew_secondary_casks_no_binaries + devbox_extra_brew_casks_no_binaries) | length > 0

- name: "Install npm packages"
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: "{{ 'latest' if devbox_upgrade_mode | default(true) | bool else 'present' }}"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  loop: "{{ devbox_npm_packages }}"

- name: "Init Rust toolchain"
  ansible.builtin.command:
    cmd: rustup-init -y
    creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cargo/bin/rustc"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

# rustup itself is the Homebrew `rustup` formula, upgraded with the other
# formulae, so only the toolchains are updated here and self-update stays off.
# `removes:` skips a machine where the toolchain was never initialised; check
# mode skips the command.
- name: "Update Rust toolchains"
  ansible.builtin.command:
    argv: [rustup, update, --no-self-update]
    removes: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cargo/bin/rustc"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: devbox_rustup_update
  changed_when: (devbox_rustup_update.stdout ~ devbox_rustup_update.stderr) is search('(updated|installed) - ')
  when: devbox_upgrade_mode | default(true) | bool

- name: "Init OCaml (auto-setup writes shell hooks)"
  ansible.builtin.command:
    cmd: opam init -y -a
    creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.opam"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

- name: "Install necessary OCaml packages"
  ansible.builtin.command:
    cmd: opam install -y ocaml-lsp-server odoc ocamlformat utop
    creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.opam/default/bin/utop"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
    OPAMSWITCH: default

# The playbook owns the `default` switch, so the whole switch is upgraded, not
# only the packages above. Both steps are skipped in check mode and on a
# machine without the switch. `--yes` also accepts the one-way layout upgrade
# of ~/.opam that a Homebrew upgrade of opam asks for; without it opam answers
# its own prompt with "n" and exits 10.
- name: "Update opam package repositories"
  ansible.builtin.command:
    argv: [opam, update, --yes]
    removes: "{{ lookup('ansible.builtin.env', 'HOME') }}/.opam/default"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
    OPAMSWITCH: default
  register: devbox_opam_update
  changed_when: "'synchronised from' in devbox_opam_update.stdout"
  when: devbox_upgrade_mode | default(true) | bool

# opam-repository metadata routinely lags behind upstream breakage (for
# example ocaml-lsp-server 1.26.1 declares no upper bound on stdune, and
# stdune 3.25.0 removed Pid.of_int), so a whole-switch upgrade can fail on a
# package nobody here changed. Every later step, including the deployment of
# the AI hooks, must not be held hostage to that: a failed upgrade restores
# the switch from the backup opam itself wrote before acting and warns. A
# failure of the restore still fails the run, because then the switch really
# is broken. A skipped upgrade (switch off, no switch, check mode) registers
# no rc, which reads as success.
- name: "Upgrade OCaml packages"
  ansible.builtin.command:
    argv: [opam, upgrade, -y]
    removes: "{{ lookup('ansible.builtin.env', 'HOME') }}/.opam/default"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
    OPAMSWITCH: default
  register: devbox_opam_upgrade
  # opam prints its action plan only when it has something to do.
  changed_when: "'The following actions ' in devbox_opam_upgrade.stdout"
  failed_when: false
  when: devbox_upgrade_mode | default(true) | bool

- name: "Restore the OCaml switch after a failed upgrade"
  when: devbox_opam_upgrade.rc | default(0) != 0
  block:
    - name: "Locate the switch backup opam wrote before the failed upgrade"
      ansible.builtin.set_fact:
        devbox_opam_backup: >-
          {{ (devbox_opam_upgrade.stderr | default(''))
             | regex_search('switch import "([^"]+\.export)"', '\1')
             | default([], true) | first | default('') }}

    - name: "Fail when opam left no backup to restore from"
      ansible.builtin.fail:
        msg: >-
          opam upgrade failed and printed no switch backup to restore from.
          stderr: {{ devbox_opam_upgrade.stderr | default('') }}
      when: devbox_opam_backup | length == 0

    - name: "Restore the OCaml switch to its pre-upgrade state"
      ansible.builtin.command:
        argv: [opam, switch, import, "{{ devbox_opam_backup }}", --yes]
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
        OPAMSWITCH: default
      changed_when: true

    - name: "Warn that the OCaml upgrade was rolled back"
      ansible.builtin.debug:
        msg: >-
          WARNING: opam upgrade failed and the default switch was restored to
          its pre-upgrade state from {{ devbox_opam_backup }}. The run
          continues. First lines of the failure:
          {{ (devbox_opam_upgrade.stderr | default('')).splitlines()[:3] | join(' | ') }}

- name: "Install SWI-Prolog LSP server"
  ansible.builtin.command:
    cmd: swipl -g "pack_install(lsp_server, [interactive(false)])" -t halt
    creates: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/swi-prolog/pack/lsp_server"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"

# pack_install with upgrade(true) succeeds quietly on an up-to-date pack, so the
# goal compares the version in pack.pl before and after and prints which one
# happened; a failing goal makes swipl exit non-zero.
- name: "Upgrade SWI-Prolog LSP server"
  ansible.builtin.command:
    argv:
      - swipl
      - -g
      - >-
        pack_property(lsp_server, directory(D)),
        directory_file_path(D, 'pack.pl', F),
        read_file_to_terms(F, T0, []), memberchk(version(Old), T0),
        pack_install(lsp_server, [upgrade(true), interactive(false)]),
        read_file_to_terms(F, T1, []), memberchk(version(New), T1),
        ( Old == New
        -> format('lsp_server unchanged at ~w~n', [Old])
        ;  format('lsp_server upgraded ~w -> ~w~n', [Old, New])
        )
      - -t
      - halt
    removes: "{{ lookup('ansible.builtin.env', 'HOME') }}/.local/share/swi-prolog/pack/lsp_server"
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: devbox_swipl_pack_upgrade
  changed_when: "'lsp_server upgraded' in devbox_swipl_pack_upgrade.stdout"
  when: devbox_upgrade_mode | default(true) | bool
