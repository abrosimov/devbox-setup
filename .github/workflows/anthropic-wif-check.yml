name: Anthropic WIF check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/anthropic-wif

      - name: Verify token exchange without a model request
        run: with-anthropic-wif check-anthropic-wif
