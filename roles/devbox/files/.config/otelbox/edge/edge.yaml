# otelbox 2.2 — deployed edge profile.
#
# Adapted from abrosimov/otelcol-otelbox v2.2.0 config/edge.yaml. This file is
# loaded alone; the binary and profile are one versioned contract.
#
# Two things arrived with 2.2.0. The gateway exporter gained an optional client
# certificate — empty by default, so a machine without one behaves exactly as it
# did under 2.1. And the gateway leg moved to zstd, which is safe only because
# both ends of that leg are this same binary: a gRPC codec has to be registered
# in the peer's build, not merely named in its configuration. Override with
# OTELBOX_UPSTREAM_COMPRESSION where the leg terminates on something else.

extensions:
  # Lifecycle health is deliberately separate from exporter delivery health.
  healthcheckv2:
    use_v2: true
    http:
      endpoint: ${env:OTELBOX_HEALTH_ENDPOINT:-127.0.0.1:13133}
      status:
        enabled: true
        path: /status
      # The expanded config includes the credential path and must stay private.
      config:
        enabled: false
    component_health:
      include_permanent_errors: true
      # Memory backpressure is not a collector lifecycle failure.
      include_recoverable_errors: false

  # A watched file lets a rejected credential rotate without a process restart.
  headers_setter/gateway:
    headers:
      - action: upsert
        key: authorization
        value_file: ${env:OTELBOX_UPSTREAM_AUTH_HEADER_FILE}

  # Accepted telemetry is persisted before acknowledgement.
  file_storage/gateway:
    directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/gateway
    create_directory: true
    fsync: true
    max_size: ${env:OTELBOX_STORAGE_MAX_SIZE_BYTES:-6442450944}
    compaction:
      on_start: true
      on_rebound: true
      directory: ${env:OTELBOX_STORAGE_DIR:-/dev/null/OTELBOX_STORAGE_DIR-is-required}/compaction/gateway
      cleanup_on_start: true

receivers:
  # Unauthenticated ingest remains loopback-only.
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTELBOX_BIND_HOST:-127.0.0.1}:4317
        max_recv_msg_size_mib: 1
      http:
        endpoint: ${env:OTELBOX_BIND_HOST:-127.0.0.1}:4318
        max_request_body_size: 1048576

  # Self-metrics traverse the same redaction and durable exporter as user data.
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otelcol-otelbox-edge
          scrape_interval: 30s
          static_configs:
            - targets:
                - ${env:OTELBOX_BIND_HOST:-127.0.0.1}:8888

processors:
  # Origin detection belongs only at the edge to avoid gateway restamping.
  resource_detection:
    detectors: [env, system]
    timeout: 2s
    override: false

  # The limiter observes Go heap rather than RSS or mapped WAL pages.
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTELBOX_MEMORY_LIMIT_MIB:-400}
    spike_limit_mib: ${env:OTELBOX_MEMORY_SPIKE_LIMIT_MIB:-80}

  # Keep this deny-list aligned with the v2.1 published role profiles.
  redaction/secrets:
    allow_all_keys: true
    redact_all_types: false
    summary: info
    blocked_key_patterns:
      - '(?i)(^|.*[._-])(auth|authorization|cookie|token|secret|credential|password|passwd|pwd|passphrase|signature|dsn)($|[._-].*)'
      - '(?i)(^|.*[._-])(api[._-]?key|private[._-]?key|connection[._-]?string)($|[._-].*)'
    blocked_values:
      - '(?i)\b(Bearer|Basic)\s+\S+'
      - '(?i)^(sk|rk|pk)[-_][A-Za-z0-9_-]{16,}$'
      - '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'
      - '\b(AKIA|ASIA)[A-Z0-9]{16}\b'
      - '\bgh[pousr]_[A-Za-z0-9]{20,}\b'
      - '\bgithub_pat_[A-Za-z0-9_]{20,}\b'
      - '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
      - '\bAIza[0-9A-Za-z_-]{20,}\b'
      - '(?i)\b[a-z][a-z0-9+.-]*://[^/\s:@]+:[^/\s@]+@'
      - '(?i)"?(api[._-]?key|client[._-]?secret|password|passwd|pwd|passphrase|token)"?\s*[:=]\s*"?[^",\s;&}]+"?'
      - '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'

exporters:
  otlp_grpc/gateway:
    endpoint: ${env:OTELBOX_UPSTREAM_ENDPOINT}
    auth:
      authenticator: headers_setter/gateway
    tls:
      # The bearer credential must never be sent to an unverified peer.
      insecure: false
      # Optional client identity, for a gateway front end demanding mTLS. It is
      # a factor the bearer token is not: the token names this client in the
      # gateway's allowlist, the certificate proves possession of a host key to
      # whatever stands in front of it, and the two rotate separately.
      #
      # Empty is the safe absent value — configtls then reads no material and
      # offers no certificate. Supply both halves or neither: `validate` rejects
      # a lone cert_file or key_file. A configured path that does not resolve is
      # NOT a load error; the exporter fails at start with `failed to load TLS
      # cert and key`, so a typo stops the process rather than quietly dropping
      # the second factor.
      cert_file: ${env:OTELBOX_UPSTREAM_TLS_CERT_FILE:-}
      key_file: ${env:OTELBOX_UPSTREAM_TLS_KEY_FILE:-}
      # Rotation without a restart, as the header file above has, by a different
      # mechanism: polling rather than fsnotify, and lazy — the pair is re-read
      # on the first handshake after this interval elapses. configtls defaults
      # to 0, which pins the process to the material it started with.
      reload_interval: ${env:OTELBOX_UPSTREAM_TLS_RELOAD_INTERVAL:-1h}
    # zstd only because both ends of THIS leg are the same binary; the gateway's
    # own recipient exporters stay on gzip, where the peer is a third-party
    # backend. `none` is legitimate where the transport already compresses. No
    # effect on the sizing invariants: `sizer: bytes` measures uncompressed
    # items and the gateway's receive envelope applies after decompression.
    compression: ${env:OTELBOX_UPSTREAM_COMPRESSION:-zstd}
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/gateway
      num_consumers: ${env:OTELBOX_EXPORTER_CONSUMERS:-2}
      sizer: bytes
      queue_size: ${env:OTELBOX_QUEUE_SIZE_BYTES:-4294967296}
      block_on_overflow: true
      batch:
        flush_timeout: 200ms
        sizer: bytes
        min_size: 524288
        max_size: 1572864
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      # A deadline would delete the backlog the WAL exists to preserve.
      max_elapsed_time: 0s
    retry_on_auth_failure:
      enabled: true
      interval: ${env:OTELBOX_AUTH_RETRY_INTERVAL:-1h}

service:
  extensions: [healthcheckv2, headers_setter/gateway, file_storage/gateway]
  telemetry:
    # Keep the telemetry contract aligned with the published role profiles.
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:OTELBOX_BIND_HOST:-127.0.0.1}
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets]
      exporters: [otlp_grpc/gateway]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets]
      exporters: [otlp_grpc/gateway]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, redaction/secrets]
      exporters: [otlp_grpc/gateway]
    metrics/self:
      receivers: [prometheus/self]
      processors: [memory_limiter, resource_detection, redaction/secrets]
      exporters: [otlp_grpc/gateway]
