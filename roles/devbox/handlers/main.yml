---
- name: Restart ControlCenter
  ansible.builtin.command: killall ControlCenter
  failed_when: false  # process absent on fresh install / headless
  changed_when: true

- name: Restart Dock
  ansible.builtin.command: killall Dock
  failed_when: false
  changed_when: true

- name: Restart Finder
  ansible.builtin.command: killall Finder
  failed_when: false
  changed_when: true

- name: Report that the Spaces change needs a new login
  ansible.builtin.debug:
    msg: >-
      "Displays have separate Spaces" changed for devbox_wm={{ devbox_wm }}.
      Log out and back in for it to take effect.
