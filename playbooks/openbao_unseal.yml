---
# Fast-path: (re)install the OpenBao unattended unseal — the dedicated SSH key,
# scripts/openbao-unseal.py and its `local.openbao-unseal` LaunchAgent. Deploys
# the local overlay first, because the overlay's
# ~/.config/openbao-unseal/config.json is what switches the agent on.
#
# No sudo, no vault. Invoked via `make openbao-unseal-push`.

- name: Deploy OpenBao unattended unseal
  hosts: 127.0.0.1
  connection: local
  gather_facts: true   # ansible_facts.user_uid addresses the gui/<uid> launchd domain

  vars_files:
    - "../roles/devbox/defaults/main/core.yml"

  tasks:
    - name: Apply local overlay tasks
      ansible.builtin.import_tasks: "../roles/devbox/tasks/install_configs.yml"
      vars:
        role_path: "{{ playbook_dir }}/../roles/devbox"

    - name: Configure OpenBao unattended unseal
      ansible.builtin.import_tasks: "../roles/devbox/tasks/darwin/configure_openbao_unseal.yml"
      vars:
        role_path: "{{ playbook_dir }}/../roles/devbox"
