---
# TRANSITIONAL — delete this file once every managed workstation has run it.
#
# This repository used to build its own edge collector (`otelcol-edge`) and
# deploy it under an `otelcol-edge` name in five places. It now installs the
# published `abrosimov/otelcol-otelbox` artefact under the `otelbox` namespace
# the workstation already uses for the keychain slot and the tunnel config.
# Everything below moves a machine from the old layout to the new one:
#
#   ~/.local/bin/otelcol-edge              → removed (the new binary is
#                                            ~/.local/bin/otelcol-otelbox)
#   ~/.config/otelcol-edge/endpoint.env    → ~/.config/otelbox/edge/endpoint.env
#   ~/.config/otelcol-edge/                → removed (rest is redeployed)
#   ~/.local/state/otelcol-edge            → ~/.local/state/otelbox/edge
#   ~/Library/LaunchAgents/local.otelcol-edge.plist → removed
#
# The WAL is moved rather than discarded: both collectors sit on upstream
# v0.156.0, so the on-disk bbolt queues are format-compatible and undelivered
# telemetry survives the switch.
#
# Every step is conditional on the old path existing AND the new one not, so a
# machine that never had the old collector runs this as a no-op, and a second
# run changes nothing. It must run BEFORE the install task creates the new
# directories: `mv src dst` with an existing dst directory nests instead of
# renaming.

- name: "OpenTelemetry edge — check for a loaded legacy LaunchAgent"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  register: devbox_otelbox_edge_legacy_agent
  changed_when: false
  failed_when: false
  # A pure read; runs under --check so the bootout decision below has an rc.
  check_mode: false
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — bootout the legacy LaunchAgent"
  # Stop the old collector before its WAL is moved out from under it.
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  when: devbox_otelbox_edge_legacy_agent.rc == 0
  changed_when: true
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — ensure the parents of the migration targets exist"
  # The state parent only, never ~/.local/state/otelbox/edge itself — that path
  # is the rename target below and must not exist when `mv` runs.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/state/otelbox"
    - "{{ ansible_facts['env']['HOME'] }}/.config/otelbox/edge"
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — move the legacy WAL to the otelbox state directory"
  # creates/removes make this a skip rather than a failure in both directions:
  # nothing to move on a clean machine, nothing to overwrite on a second run.
  ansible.builtin.command:
    argv:
      - /bin/mv
      - "{{ ansible_facts['env']['HOME'] }}/.local/state/otelcol-edge"
      - "{{ ansible_facts['env']['HOME'] }}/.local/state/otelbox/edge"
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/state/otelbox/edge"
    removes: "{{ ansible_facts['env']['HOME'] }}/.local/state/otelcol-edge"
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — move the live endpoint.env to the otelbox config directory"
  # The machine-local overlay in the repository was moved by hand in the same
  # change; this covers the deployed copy, which Ansible would otherwise not
  # recreate until the overlay is pushed.
  ansible.builtin.command:
    argv:
      - /bin/mv
      - "{{ ansible_facts['env']['HOME'] }}/.config/otelcol-edge/endpoint.env"
      - "{{ ansible_facts['env']['HOME'] }}/.config/otelbox/edge/endpoint.env"
    creates: "{{ ansible_facts['env']['HOME'] }}/.config/otelbox/edge/endpoint.env"
    removes: "{{ ansible_facts['env']['HOME'] }}/.config/otelcol-edge/endpoint.env"
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — remove the legacy binary, config directory and plist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.local/bin/otelcol-edge"
    - "{{ ansible_facts['env']['HOME'] }}/.config/otelcol-edge"
    - "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/local.otelcol-edge.plist"
  loop_control:
    label: "{{ item }}"
  tags: [otel, otelbox-edge]
