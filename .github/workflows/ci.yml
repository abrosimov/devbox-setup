name: CI

# Lint + validate the repo on every push to the working branches and on PRs.
# Each job mirrors a Makefile target so the Makefile stays the single source of
# truth — CI never re-spells a tool invocation, it just runs `make <target>`.
#
# Deliberately NOT run here:
#   - test-nvim     : downloads lazy.nvim plugins at runtime (slow, flaky)
#   - eval-skills   : needs the `claude` CLI + Anthropic API (cost, secrets)
#   - test-live     : installs real engine CLIs; see live-engines.yml
#   - the operator flow (make personal/work) : provisions a real machine

on:
  push:
    branches:
      - master
      - "claude/**"
  pull_request:
    branches:
      - master

# A newer push to the same ref cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (yaml · python · ansible · types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Put the dev venv on PATH up front. The bin dir doesn't exist yet, but
      # PATH is resolved at exec time: `make lint` populates .venv via uv first
      # (DEV_SENTINEL), so the later bare `ansible-galaxy` in COLLECTIONS_SENTINEL
      # resolves to the venv copy by the time it runs.
      - name: Put dev venv on PATH
        run: echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: make lint
        run: make lint

  validate:
    name: Validate (claude config · skill evals · json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      # jq is preinstalled on ubuntu-latest runners; assert it so a future image
      # change fails loudly instead of silently skipping the JSON check.
      - name: Check jq is available
        run: jq --version

      - name: Verify pinned Claude Langfuse hook (offline)
        run: python3 scripts/langfuse-hook-source.py verify

      - name: Rebuild pinned Claude Langfuse patches from upstream
        run: |
          python3 scripts/langfuse-hook-source.py refresh
          git diff --exit-code -- roles/devbox/files/dot_claude/bin/vendor/langfuse_hook.py

      - name: Validate Claude agent/skill/command cross-references
        run: make validate-claude

      - name: Validate skill eval files
        run: make validate-skills

      - name: Validate JSON config + schema files
        run: make test-json

  test:
    name: Test (pytest · bash · fish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install fish shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fish

      - name: Python unit tests
        run: make test

      # The reconciler that writes ~/.claude/settings.json, ~/.codex/config.toml
      # and agy's settings.json. Two of those three engines accept an unparseable
      # file in silence — Claude Code drops it and runs a session indistinguishable
      # from one with no hooks at all, agy loads permissions=<nil> and says so only
      # in its language-server log. Nothing downstream would report a generator bug,
      # so this suite is the only place it can surface. ~7s.
      - name: ai-config reconciler tests
        run: make test-ai-config

      # Subprocess smoke + hypothesis over the hooks: they run as separate
      # processes in production, which the unit tests do not exercise.
      - name: Hook integration tests
        run: make test-integration

      - name: Git hook tests
        run: make test-git-hooks

      - name: Script tests
        run: make test-scripts

      - name: drive-backup package tests
        run: make test-drive-backup

      - name: Dotfile-deploy structure tests
        run: make test-deploy

      # The hermetic half of tests/live/: the throwaway-home guard that keeps the
      # engine tests off the operator's real ~/.claude, and the guard that stops a
      # CI runner skipping an engine it was told to exercise. Neither needs a
      # binary, so unlike the engine tests themselves (see live-engines.yml) they
      # are not optional here.
      - name: Live-suite guards
        run: make test-live-guard

      - name: Bash script syntax check
        run: make test-bash

      - name: Fish config syntax check
        run: make test-fish

  # The two hook trees carry their own uv projects (roles/devbox/files/dot_claude/bin
  # and dot_agy/bin), each with its own uv.lock, and both targets run the same
  # `uv sync --frozen` the playbook does. That is the point: a drift between a
  # lock and its test suite otherwise surfaces for the first time mid-deploy, in
  # Block 1b of install_configs.yml, where it breaks every Python hook on every
  # Bash call. They are a separate job because they use their own venvs rather
  # than the root dev one, and because ~85s in parallel beats ~165s in series.
  #
  # dot_agy/bin is an independent copy of the same tree that has already diverged
  # from dot_claude/bin — a green claude-hooks run says nothing about it.
  hook-projects:
    name: Hook projects (deployed-venv shape)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Claude hook tests
        run: make test-claude-hooks

      - name: Antigravity hook tests
        run: make test-agy-hooks
