name: otelcol-edge

# Auto-release the slim OCB edge collector (darwin/arm64). The version is the
# SINGLE source of truth in otelcol-edge/builder.yaml (dist.version): bump it,
# merge to master, and this workflow builds + publishes the matching
# `otelcol-edge-v<version>` release — no hand-cut tags. Idempotent: if the
# release already exists, the build is skipped. workflow_dispatch forces a run
# (still guarded by release existence — delete the release to rebuild).
#
# Ansible (roles/devbox/tasks/darwin/install_otelcol_edge.yml) reads the same
# dist.version and downloads the published asset via get_url.

on:
  push:
    branches: [master]
    paths: ["otelcol-edge/builder.yaml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: otelcol-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Resolve version + release state
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_exists: ${{ steps.resolve.outputs.release_exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version from builder.yaml and check release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -E '^  version:' otelcol-edge/builder.yaml | head -1 | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "could not read dist.version from otelcol-edge/builder.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "otelcol-edge-v$version" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release otelcol-edge-v$version already exists — build will be skipped."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "Release otelcol-edge-v$version not found — will build and publish."
          fi

  build:
    name: Build (darwin/arm64) + release
    needs: check
    if: needs.check.outputs.release_exists == 'false'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install OpenTelemetry Collector Builder (OCB)
        run: go install go.opentelemetry.io/collector/cmd/builder@v${VERSION}

      - name: Build otelcol-edge
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          "$(go env GOPATH)/bin/builder" --config otelcol-edge/builder.yaml
          install -m 0755 otelcol-edge/_build/otelcol-edge otelcol-edge_darwin_arm64

      - name: Smoke-check linked components
        run: |
          ./otelcol-edge_darwin_arm64 components | grep -q file_storage
          ./otelcol-edge_darwin_arm64 components | grep -q redaction

      - name: Checksum
        run: shasum -a 256 otelcol-edge_darwin_arm64 | awk '{print $1}' > otelcol-edge_darwin_arm64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="otelcol-edge-v${VERSION}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "OCB-built durable edge collector (darwin/arm64). See otelcol-edge/README.md." \
            otelcol-edge_darwin_arm64 otelcol-edge_darwin_arm64.sha256 \
          || gh release upload "$tag" \
            otelcol-edge_darwin_arm64 otelcol-edge_darwin_arm64.sha256 --clobber
