devbox_projects_dir: "$HOME/Projects"
devbox_active_profile: "personal"
devbox_langfuse_user_id: "abrosimov.k.a@gmail.com"

# Profile-specific extras (concatenated with base lists in task files).
# devbox_extra_brew: []
# devbox_extra_brew_casks: []
# ClickStack (HyperDX v2) on the telemetry host, reached through the `otelbox`
# SSH tunnel (OTELBOX_CLICKSTACK_PORT, default 28080), so the tunnel must be up.
# The Personal API access key comes from the Keychain (make clickstack-config).
devbox_extra_mcp_http_servers:
  - name: clickstack
    url: "http://127.0.0.1:28080/api/mcp"
    headers_helper: >-
      ~/.claude/bin/.venv/bin/python ~/.claude/bin/mcp_keychain_headers.py
      --service devbox-clickstack --account personal-api-key
devbox_extra_auto_mode_trusted_remote_owners:
  - host: github.com
    owner: abrosimov-tech

devbox_extra_brew_casks_no_binaries:
  - docker-desktop     # personal-only; work uses OrbStack
  - cloudflare-warp    # personal-only

# The langfuse skill reads its API keys from the login Keychain (make langfuse-config).
devbox_langfuse_host: "https://langfuse.abrosimov.tech"
