---
- name: "Apply macOS user defaults"
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    host: "{{ item.host | default(omit) }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
    # Skip the module's own type-comparison guard. Native `defaults write` will
    # overwrite atomically when the on-disk type differs from the requested one,
    # but the module raises `Type mismatch` instead of delegating. Turning the
    # guard off makes the task self-healing against manual `defaults write X Y`
    # calls (without `-bool`/`-int`) that leave keys stored as strings.
    check_type: false
  loop: "{{ devbox_macos_defaults + (devbox_extra_macos_defaults | default([])) }}"
  loop_control:
    label: "{{ item.domain }}.{{ item.key }}"
  register: devbox_macos_defaults_result
  notify:
    - Restart ControlCenter
    - Restart Dock
    - Restart Finder
  tags: [macos, defaults]

# None of these keys is an Apple API: each is an implementation detail of the
# app that owns the domain, so a macOS update can rename, relocate or ignore it
# and the write above still succeeds. Read every key back with `defaults read`,
# the view the owning app gets, and fail the run on a missing key or a different
# value. `defaults read` prints booleans as 1/0 and numbers in their shortest
# form, so booleans and integers compare as text and floats numerically.
# Skipped in check mode, where nothing was written.
- name: "Verify macOS user defaults read back as written"
  ansible.builtin.command:
    argv: >-
      {{ ['defaults']
         + (['-currentHost'] if (item.host | default('')) == 'currentHost' else [])
         + ['read', item.domain, item.key] }}
  loop: "{{ devbox_macos_defaults + (devbox_extra_macos_defaults | default([])) }}"
  loop_control:
    label: "{{ item.domain }}.{{ item.key }}"
  register: devbox_macos_defaults_check
  changed_when: false
  failed_when: >-
    devbox_macos_defaults_check.rc != 0
    or (
      (((devbox_macos_defaults_check.stdout | trim | float) - (item.value | float)) | abs) > 0.000001
      if item.type == 'float'
      else (devbox_macos_defaults_check.stdout | trim)
        != ((('1' if item.value else '0') if item.type == 'bool' else (item.value | string)))
    )
  when: not ansible_check_mode
  tags: [macos, defaults]

# NOTE: devbox_macos_defaults_result feeds the re-login gate in main.yml. Most
# defaults here apply via the killall handlers above or take effect immediately,
# so they never need a fresh login. The exception is login-cached NSGlobalDomain
# keyboard keys (KeyRepeat/InitialKeyRepeat): apps read them once at process
# start, so a running session keeps the old value until logout/login.

# Night Shift lives in CoreBrightness (no public `defaults` schema) — driven
# via the `nightlight` brew formula. Idempotency is structural: each dimension
# (status / schedule / temperature) is queried via the CLI that actually
# emits it, then compared to the desired value from `devbox_night_shift`.
# `nightlight status` output format ("on until 9:00") does NOT contain the
# schedule or temperature — DO NOT collapse the three reads back into one.
#
# Locale assumption: the Mac is set to a 24-hour clock. In 12-hour locales
# nightlight prints "9:00pm to 9:00am" and the schedule compare below misses,
# causing the set task to fire every run (still safe, just not idempotent).
- name: "Night Shift — read current status"
  ansible.builtin.command: nightlight status
  register: devbox_ns_status
  changed_when: false
  check_mode: false
  when: devbox_night_shift.enabled | default(false)
  tags: [macos, defaults, nightshift]

- name: "Night Shift — read current schedule"
  ansible.builtin.command: nightlight schedule
  register: devbox_ns_schedule
  changed_when: false
  check_mode: false
  when: devbox_night_shift.enabled | default(false)
  tags: [macos, defaults, nightshift]

- name: "Night Shift — read current temperature"
  ansible.builtin.command: nightlight temp
  register: devbox_ns_temp
  changed_when: false
  check_mode: false
  when: devbox_night_shift.enabled | default(false)
  tags: [macos, defaults, nightshift]

- name: "Night Shift — turn on"
  ansible.builtin.command: nightlight on
  when:
    - devbox_night_shift.enabled | default(false)
    - (devbox_ns_status.stdout | default('') | trim) is match('^off\b')
  changed_when: true
  tags: [macos, defaults, nightshift]

- name: "Night Shift — set schedule ({{ devbox_night_shift.schedule }})"
  ansible.builtin.command: "nightlight schedule {{ devbox_night_shift.schedule }}"
  vars:
    # devbox_night_shift.schedule is "HH:MM HH:MM" (zero-padded); nightlight
    # prints "H:MM to H:MM" (24-hr, no leading zero on the hour). Normalize
    # the config to the CLI shape before comparing.
    _devbox_ns_from_h: "{{ devbox_night_shift.schedule.split()[0].split(':')[0] | int }}"
    _devbox_ns_from_m: "{{ devbox_night_shift.schedule.split()[0].split(':')[1] }}"
    _devbox_ns_to_h: "{{ devbox_night_shift.schedule.split()[1].split(':')[0] | int }}"
    _devbox_ns_to_m: "{{ devbox_night_shift.schedule.split()[1].split(':')[1] }}"
    _devbox_ns_expected_schedule: >-
      {{ _devbox_ns_from_h }}:{{ _devbox_ns_from_m }} to
      {{ _devbox_ns_to_h }}:{{ _devbox_ns_to_m }}
  when:
    - devbox_night_shift.enabled | default(false)
    - devbox_night_shift.schedule != "sunset"
    - (devbox_ns_schedule.stdout | default('') | trim) != _devbox_ns_expected_schedule
  changed_when: true
  tags: [macos, defaults, nightshift]

- name: "Night Shift — set schedule (sunset → sunrise)"
  # `nightlight schedule start` — not `schedule sunset` (`sunset` is not a
  # subcommand; the CLI prints usage and exits 0 without changing state).
  ansible.builtin.command: nightlight schedule start
  when:
    - devbox_night_shift.enabled | default(false)
    - devbox_night_shift.schedule == "sunset"
    - (devbox_ns_schedule.stdout | default('') | trim) != 'sunset to sunrise'
  changed_when: true
  tags: [macos, defaults, nightshift]

- name: "Night Shift — set temperature ({{ devbox_night_shift.temperature }})"
  ansible.builtin.command: "nightlight temp {{ devbox_night_shift.temperature }}"
  when:
    - devbox_night_shift.enabled | default(false)
    - (devbox_ns_temp.stdout | default('') | trim | int) != (devbox_night_shift.temperature | int)
  changed_when: true
  tags: [macos, defaults, nightshift]

# CoreBrightness is private: nightlight drives it through undocumented calls, and
# a call macOS ignores still exits 0. Read all three dimensions back after the
# writes, with the same normalisation as the set tasks, and fail the run on any
# difference. Under a 12-hour clock (see the locale note above) the schedule
# never matches and this task fails, rather than the set task silently firing on
# every run. Skipped in check mode, where nothing was written.
- name: "Night Shift — verify status, schedule and temperature"
  ansible.builtin.shell: |
    set -eu
    printf 'status=%s\n' "$(nightlight status)"
    printf 'schedule=%s\n' "$(nightlight schedule)"
    printf 'temp=%s\n' "$(nightlight temp)"
  vars:
    _devbox_ns_from_h: "{{ devbox_night_shift.schedule.split()[0].split(':')[0] | int }}"
    _devbox_ns_from_m: "{{ devbox_night_shift.schedule.split()[0].split(':')[1] }}"
    _devbox_ns_to_h: "{{ devbox_night_shift.schedule.split()[1].split(':')[0] | int }}"
    _devbox_ns_to_m: "{{ devbox_night_shift.schedule.split()[1].split(':')[1] }}"
    _devbox_ns_expected_schedule: >-
      {{ 'sunset to sunrise' if devbox_night_shift.schedule == 'sunset'
         else _devbox_ns_from_h ~ ':' ~ _devbox_ns_from_m ~ ' to ' ~ _devbox_ns_to_h ~ ':' ~ _devbox_ns_to_m }}
  register: devbox_ns_check
  changed_when: false
  failed_when: >-
    devbox_ns_check.rc != 0
    or devbox_ns_check.stdout is search('(?m)^status=off\b')
    or ('schedule=' ~ (_devbox_ns_expected_schedule | trim))
      not in (devbox_ns_check.stdout_lines | map('trim') | list)
    or ('temp=' ~ (devbox_night_shift.temperature | int))
      not in (devbox_ns_check.stdout_lines | map('trim') | list)
  when:
    - devbox_night_shift.enabled | default(false)
    - not ansible_check_mode
  tags: [macos, defaults, nightshift]
