---
# update_homebrew first: refresh the API cache so a stale cask def can't fail parsing against newer brew DSL.
- name: "Install Homebrew apps"
  community.general.homebrew:
    name: "{{ devbox_brew_primary }}"
    state: "{{ 'latest' if devbox_upgrade_mode | default(true) | bool else 'present' }}"
    update_homebrew: true

- name: "Install fontconfig (ignore post-install warnings)"
  community.general.homebrew:
    name: "{{ devbox_brew_primary_special }}"
    state: "{{ 'latest' if devbox_upgrade_mode | default(true) | bool else 'present' }}"
  register: devbox_fontconfig_result
  failed_when:
    - devbox_fontconfig_result.failed is defined
    - devbox_fontconfig_result.failed
    - '"post-install" not in devbox_fontconfig_result.msg'

# No failed_when: the module skips an installed cask itself, and on a failure
# it stops at that cask with brew's whole stderr as `msg`, so tolerating any
# phrase in it would leave every later cask in the list silently uninstalled.
- name: "Install Homebrew casks"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_primary_casks }}"
    state: present
    install_options: 'adopt'
    upgrade_all: false
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true   # Prevents the sudo password leaking into -v / -vvv output.

# A separate task because the module hands install_options to `brew upgrade`
# too, and `brew upgrade` rejects `--adopt`. Every cask is installed by now, so
# this only upgrades the outdated ones. Not greedy: casks that update
# themselves are left to do so. Retried because a transient 5xx from a vendor's
# download host (e.g. GitHub releases) would otherwise fail the whole run.
- name: "Upgrade Homebrew casks"
  community.general.homebrew_cask:
    name: "{{ devbox_brew_primary_casks }}"
    state: latest
    sudo_password: "{{ devbox_sudo_password }}"
  no_log: true   # Prevents the sudo password leaking into -v / -vvv output.
  register: devbox_cask_primary_upgrade_result
  until: devbox_cask_primary_upgrade_result is succeeded
  retries: 3
  delay: 30
  when:
    - devbox_upgrade_mode | default(true) | bool
    - devbox_brew_primary_casks | length > 0
