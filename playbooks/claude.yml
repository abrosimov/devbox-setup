---
# Slim fast-path playbook for AI configs (Claude / Antigravity).
# Uses `--tags claude` or `--tags agy` internally (see Makefile).
# Runs only the tasks related to deploying AI configuration.
#
# Unlike the main profiles (playbooks/personal.yml etc), this playbook runs
# entirely in userspace: no `become: true`, no package managers, no
# system-wide configuration, and no keychain vault unlocks required.

- name: Deploy AI Configs
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "../roles/devbox/defaults/main/core.yml"
    - "../roles/devbox/defaults/main/claude.yml"

  vars:
    # Explicit list of subdirectories managed by Block 1 one-way rsync
    # (these are exclusively owned by the repo; any host-side changes
    # not committed back to the repo will be overwritten on deploy)
    devbox_claude_managed_dirs:
      - bin
      - future_projects
      - output-styles
      - templates
      - schemas
      - docs

    # These directories are shared between Claude and Antigravity
    devbox_ai_managed_dirs:
      - agents
      - commands
      - skills

  tasks:
    - name: Deploy AI managed subdirs and root files
      ansible.builtin.import_tasks: "../roles/devbox/tasks/install_configs.yml"
      vars:
        # role_path is normally injected by the `roles:` loop. Set it explicitly
        # here so the synchronize task's `src:` resolves correctly.
        role_path: "{{ playbook_dir }}/../roles/devbox"
