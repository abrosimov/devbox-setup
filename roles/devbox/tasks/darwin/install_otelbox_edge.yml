---
# Durable OpenTelemetry edge collector — the published `otelcol-otelbox` binary
# from abrosimov/otelcol-otelbox, pinned in defaults/main/packages.yml.
#
# Nothing is built here. The artefact repository owns the component set and
# release pipeline; this repository owns the deployed edge profile, secrets,
# supervisor and machine-local values. Binary and profile move as one contract.
#
# Destructive legacy cleanup is gated by the exact binary, profile validation,
# endpoint contract and Keychain credential. A missing input leaves v1 running.
#
# Guarded by the include in main_darwin.yml (Darwin + not dev_mode). Everything
# below additionally honours devbox_packages.otelbox_edge.enabled.

- name: "OpenTelemetry edge — check for a conflicting Homebrew keg"
  # The artefact also publishes a Homebrew formula, whose own caveats say so:
  # on a workstation this playbook manages, Homebrew is not the installation
  # path. Both at once puts two copies on disk, free to drift, with launchd
  # running the one Homebrew did not install.
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --formula
      - --versions
      - otelcol-otelbox
  environment:
    PATH: "/opt/homebrew/bin:{{ ansible_facts['env']['PATH'] }}"
  register: devbox_otelbox_edge_brew_keg
  changed_when: false
  failed_when: false
  # A pure read, and a conflict a dry run should still report — so it runs under
  # --check too. Without this the probe is skipped there, `rc` never exists, and
  # the guard below has nothing to decide on.
  check_mode: false
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — refuse to run alongside a Homebrew keg"
  ansible.builtin.fail:
    msg: >-
      otelcol-otelbox is installed via Homebrew ({{
      devbox_otelbox_edge_brew_keg.stdout | default('') | trim }}), and this
      playbook installs the same artefact into ~/.local/bin. Two copies on disk
      drift freely and launchd would run the one Homebrew did not install.
      Resolve it with `brew uninstall otelcol-otelbox`, then re-run.
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_brew_keg.rc is defined
    - devbox_otelbox_edge_brew_keg.rc == 0
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — resolve paths"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_home: "{{ ansible_facts['env']['HOME'] }}"
    devbox_otelbox_edge_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/otelcol-otelbox"
    devbox_otelbox_edge_staged_bin: >-
      {{ ansible_facts['env']['HOME'] }}/.local/bin/otelcol-otelbox-{{
      devbox_packages.otelbox_edge.version }}
    devbox_otelbox_edge_conf: "{{ ansible_facts['env']['HOME'] }}/.config/otelbox/edge"
    devbox_otelbox_edge_endpoint_env: "{{ ansible_facts['env']['HOME'] }}/.config/otelbox/edge/endpoint.env"
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

# Separate set_fact: keys in one set_fact are templated against the pre-task
# scope, so asset_base cannot see a sibling key defined in the same task.
# The release tag is bare `v<version>` — the artefact repository builds exactly
# one artefact, so its tags carry no artefact prefix.
- name: "OpenTelemetry edge — resolve download URL"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_asset_base: >-
      {{ devbox_packages.otelbox_edge.release_base }}/v{{
      devbox_packages.otelbox_edge.version }}/otelcol-otelbox_darwin_arm64
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — ensure directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ devbox_otelbox_edge_home }}/.local/bin"
    - "{{ devbox_otelbox_edge_conf }}"
    - "{{ devbox_otelbox_edge_home }}/.local/state/otelbox/edge"
    - "{{ devbox_otelbox_edge_home }}/Library/LaunchAgents"
    - "{{ devbox_otelbox_edge_home }}/Library/Logs"
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — inspect the current managed binary"
  ansible.builtin.stat:
    path: "{{ devbox_otelbox_edge_bin }}"
  register: devbox_otelbox_edge_existing_bin_stat
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — read the current managed binary version"
  ansible.builtin.command:
    argv:
      - "{{ devbox_otelbox_edge_bin }}"
      - --version
  register: devbox_otelbox_edge_existing_version
  changed_when: false
  failed_when: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_existing_bin_stat.stat.exists | default(false)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — classify the current managed binary"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_existing_is_pinned: >-
      {{
        devbox_otelbox_edge_existing_bin_stat.stat.exists | default(false)
        and (devbox_otelbox_edge_existing_version.rc | default(1)) == 0
        and (devbox_otelbox_edge_existing_version.stdout | default('') | trim)
          == ('otelcol-otelbox version ' ~ devbox_packages.otelbox_edge.version)
      }}
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — download the pinned release binary (darwin/arm64)"
  # failed_when:false — a transient network failure, or a version pinned ahead
  # of its release, must not brick the run. The service bootstrap below is gated
  # on the binary actually being present, so ordering never fails the playbook.
  # The checksum is fetched from the published .sha256 (bare hex, no filename
  # column) rather than pinned here by hand.
  ansible.builtin.get_url:
    url: "{{ devbox_otelbox_edge_asset_base }}"
    checksum: "sha256:{{ devbox_otelbox_edge_asset_base }}.sha256"
    dest: "{{ devbox_otelbox_edge_staged_bin }}"
    mode: "0755"
  register: devbox_otelbox_edge_download
  failed_when: false
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — inspect the downloaded binary"
  ansible.builtin.stat:
    path: "{{ devbox_otelbox_edge_staged_bin }}"
  register: devbox_otel_bin_stat
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — read the staged binary version"
  ansible.builtin.command:
    argv:
      - "{{ devbox_otelbox_edge_staged_bin }}"
      - --version
  register: devbox_otelbox_edge_version
  changed_when: false
  failed_when: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otel_bin_stat.stat.exists | default(false)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — accept only the pinned binary"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_binary_matches: >-
      {{
        devbox_otel_bin_stat.stat.exists | default(false)
        and (devbox_otelbox_edge_version.rc | default(1)) == 0
        and (devbox_otelbox_edge_version.stdout | default('') | trim)
          == ('otelcol-otelbox version ' ~ devbox_packages.otelbox_edge.version)
      }}
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — check the machine-local endpoint file"
  ansible.builtin.stat:
    path: "{{ devbox_otelbox_edge_endpoint_env }}"
  register: devbox_otelbox_edge_endpoint_stat
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — validate the endpoint file contract"
  ansible.builtin.command:
    argv:
      - /usr/bin/awk
      - >-
        NR == 1 && $0 ~ /^OTELBOX_UPSTREAM_ENDPOINT=[^[:space:]]+:[0-9]+$/
        { valid=1 } END { exit !(NR == 1 && valid) }
      - "{{ devbox_otelbox_edge_endpoint_env }}"
  register: devbox_otelbox_edge_endpoint_check
  changed_when: false
  failed_when: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_endpoint_stat.stat.exists | default(false)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — check the Keychain credential"
  ansible.builtin.command:
    argv:
      - /usr/bin/security
      - find-generic-password
      - -a
      - "{{ ansible_facts['user_id'] }}"
      - -s
      - otelbox-edge-token
  register: devbox_otelbox_edge_keychain_check
  changed_when: false
  failed_when: false
  no_log: true
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — decide whether v2.1 preflight can run"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_preflight_ready: >-
      {{
        devbox_otelbox_edge_binary_matches | bool
        and devbox_otelbox_edge_endpoint_stat.stat.exists | default(false)
        and (devbox_otelbox_edge_endpoint_check.rc | default(1)) == 0
        and (devbox_otelbox_edge_keychain_check.rc | default(1)) == 0
      }}
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — validate the v2.1 profile before cleanup"
  ansible.builtin.command:
    argv:
      - "{{ devbox_otelbox_edge_staged_bin }}"
      - validate
      - "--config={{ role_path }}/files/.config/otelbox/edge/edge.yaml"
  environment:
    OTELBOX_BIND_HOST: 127.0.0.1
    OTELBOX_HEALTH_ENDPOINT: 127.0.0.1:13133
    OTELBOX_STORAGE_DIR: /tmp/otelbox-edge-validate
    OTELBOX_UPSTREAM_ENDPOINT: validate.invalid:443
    OTELBOX_UPSTREAM_AUTH_HEADER_FILE: /dev/null
    OTELBOX_MEMORY_LIMIT_MIB: "400"
    OTELBOX_MEMORY_SPIKE_LIMIT_MIB: "80"
    OTELBOX_EXPORTER_CONSUMERS: "2"
    OTELBOX_STORAGE_MAX_SIZE_BYTES: "6442450944"
    OTELBOX_QUEUE_SIZE_BYTES: "4294967296"
  changed_when: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — check for the legacy LaunchAgent"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  register: devbox_otelbox_edge_legacy_agent
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — check for an unpinned managed LaunchAgent"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelbox-edge"
  register: devbox_otelbox_edge_unpinned_agent
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
    - not (devbox_otelbox_edge_existing_is_pinned | bool)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — stop the legacy collector"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  changed_when: true
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
    - (devbox_otelbox_edge_legacy_agent.rc | default(1)) == 0
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — stop an unpinned managed collector"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelbox-edge"
  changed_when: true
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
    - not (devbox_otelbox_edge_existing_is_pinned | bool)
    - (devbox_otelbox_edge_unpinned_agent.rc | default(1)) == 0
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — remove the legacy collector and WAL"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ devbox_otelbox_edge_home }}/.local/bin/otelcol-edge"
    - "{{ devbox_otelbox_edge_home }}/.config/otelcol-edge"
    - "{{ devbox_otelbox_edge_home }}/.local/state/otelcol-edge"
    - "{{ devbox_otelbox_edge_home }}/Library/LaunchAgents/local.otelcol-edge.plist"
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — discard the pre-v2.1 managed WAL"
  ansible.builtin.file:
    path: "{{ devbox_otelbox_edge_home }}/.local/state/otelbox/edge"
    state: absent
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
    - not (devbox_otelbox_edge_existing_is_pinned | bool)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — install the validated v2.1 binary"
  ansible.builtin.copy:
    src: "{{ devbox_otelbox_edge_staged_bin }}"
    dest: "{{ devbox_otelbox_edge_bin }}"
    remote_src: true
    mode: "0755"
  register: devbox_otelbox_edge_binary_installed
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — deploy the v2.1 profile"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/.config/otelbox/edge/{{ item }}"
    dest: "{{ devbox_otelbox_edge_conf }}/{{ item }}"
    mode: "0644"
  loop:
    - edge.yaml
    - endpoint.env.example
  loop_control:
    label: "otelbox/edge/{{ item }}"
  register: devbox_otelbox_edge_config_files
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — remove the v1 base layer"
  ansible.builtin.file:
    path: "{{ devbox_otelbox_edge_conf }}/base.yaml"
    state: absent
  register: devbox_otelbox_edge_base_removed
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — deploy wrapper (executable)"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/.config/otelbox/edge/otelbox-edge-run"
    dest: "{{ devbox_otelbox_edge_conf }}/otelbox-edge-run"
    mode: "0755"
  register: devbox_otelbox_edge_wrapper
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — deploy LaunchAgent plist"
  ansible.builtin.template:
    src: darwin/Library/LaunchAgents/local.otelbox-edge.plist.j2
    dest: "{{ devbox_otelbox_edge_home }}/Library/LaunchAgents/local.otelbox-edge.plist"
    mode: "0644"
  register: devbox_otelbox_edge_plist
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_preflight_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — decide whether v2.1 can start"
  ansible.builtin.set_fact:
    devbox_otelbox_edge_ready: >-
      {{ devbox_otelbox_edge_preflight_ready | bool }}
  when: devbox_packages.otelbox_edge.enabled | default(true)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — report skipped bootstrap (binary or endpoint missing)"
  ansible.builtin.debug:
    msg: >-
      otelbox-edge service not started: {{ 'the installed binary is not v'
      ~ devbox_packages.otelbox_edge.version
      if not (devbox_otelbox_edge_binary_matches | bool)
      else 'run `make otelbox-edge-config` to install the v2.1 endpoint and '
      ~ 'Keychain credential contract' }}.
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - not (devbox_otelbox_edge_ready | bool)
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — check LaunchAgent bootstrap status"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelbox-edge"
  register: devbox_otelbox_edge_agent_status
  changed_when: false
  failed_when: false
  # A pure read; runs under --check so the three decisions below have an rc.
  check_mode: false
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_ready | bool
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — bootout LaunchAgent (if plist changed and loaded)"
  # bootstrap fails on an already-loaded service; on a plist change we bootout
  # first to pick up the new definition. Mirrors configure_ssh_keychain.yml.
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelbox-edge"
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_ready | bool
    - devbox_otelbox_edge_plist.changed
    - devbox_otelbox_edge_agent_status.rc == 0
  changed_when: true
  failed_when: false
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — bootstrap LaunchAgent"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootstrap
      - "gui/{{ ansible_facts['user_uid'] }}"
      - "{{ devbox_otelbox_edge_home }}/Library/LaunchAgents/local.otelbox-edge.plist"
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_ready | bool
    - devbox_otelbox_edge_plist.changed or devbox_otelbox_edge_agent_status.rc != 0
  changed_when: true
  tags: [otel, otelbox-edge]

- name: "OpenTelemetry edge — restart a running service after a managed change"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - kickstart
      - -k
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelbox-edge"
  when:
    - devbox_packages.otelbox_edge.enabled | default(true)
    - devbox_otelbox_edge_ready | bool
    - not devbox_otelbox_edge_plist.changed
    - devbox_otelbox_edge_agent_status.rc == 0
    - devbox_otelbox_edge_binary_installed.changed
      or devbox_otelbox_edge_config_files.changed
      or devbox_otelbox_edge_base_removed.changed
      or devbox_otelbox_edge_wrapper.changed
  changed_when: true
  tags: [otel, otelbox-edge]
