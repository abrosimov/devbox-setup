---
# Durable OpenTelemetry edge collector — OCB-built binary (no brew, no tap).
# Downloads the pinned release built by .github/workflows/otelcol-edge.yml,
# deploys the two config layers + wrapper, and supervises it via a LaunchAgent.
# See otelcol-edge/README.md for the release flow and machine-local setup.
#
# Non-bricking by design: if the release binary is not published yet, or the
# machine-local endpoint.env has not been created, the download/bootstrap steps
# warn and skip instead of failing the whole run.
#
# Guarded by the include in main_darwin.yml (Darwin + not dev_mode). Everything
# below additionally honours devbox_packages.otelcol_edge.enabled.

- name: "OpenTelemetry edge — resolve paths"
  ansible.builtin.set_fact:
    devbox_otelcol_edge_home: "{{ ansible_facts['env']['HOME'] }}"
    devbox_otelcol_edge_bin: "{{ ansible_facts['env']['HOME'] }}/.local/bin/otelcol-edge"
    devbox_otelcol_edge_conf: "{{ ansible_facts['env']['HOME'] }}/.config/otelcol-edge"
    devbox_otelcol_edge_endpoint_env: "{{ ansible_facts['env']['HOME'] }}/.config/otelcol-edge/endpoint.env"
    # Single source of truth for the version: otelcol-edge/builder.yaml dist.version
    # (role_path is .../roles/devbox, so ../../ resolves to the repo root).
    devbox_otelcol_edge_version: >-
      {{ (lookup('ansible.builtin.file', role_path ~ '/../../otelcol-edge/builder.yaml')
          | from_yaml).dist.version }}
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

# Separate set_fact: keys in one set_fact are templated against the pre-task
# scope, so asset_base cannot see the version defined above in the same task.
- name: "OpenTelemetry edge — resolve download URL"
  ansible.builtin.set_fact:
    devbox_otelcol_edge_asset_base: >-
      {{ devbox_packages.otelcol_edge.release_base }}/otelcol-edge-v{{
      devbox_otelcol_edge_version }}/otelcol-edge_darwin_arm64
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — ensure directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ devbox_otelcol_edge_home }}/.local/bin"
    - "{{ devbox_otelcol_edge_conf }}"
    - "{{ devbox_otelcol_edge_home }}/.local/state/otelcol-edge"
    - "{{ devbox_otelcol_edge_home }}/Library/LaunchAgents"
    - "{{ devbox_otelcol_edge_home }}/Library/Logs"
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — download OCB binary (darwin/arm64, pinned)"
  # failed_when:false — the release may not be published yet on a fresh setup.
  # A missing binary is tolerated; the service bootstrap below is gated on its
  # presence, so the playbook never bricks on ordering.
  ansible.builtin.get_url:
    url: "{{ devbox_otelcol_edge_asset_base }}"
    checksum: "sha256:{{ devbox_otelcol_edge_asset_base }}.sha256"
    dest: "{{ devbox_otelcol_edge_bin }}"
    mode: "0755"
  register: devbox_otelcol_edge_download
  failed_when: false
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — deploy config layers"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/.config/otelcol-edge/{{ item }}"
    dest: "{{ devbox_otelcol_edge_conf }}/{{ item }}"
    mode: "0644"
  loop:
    - base.yaml
    - config.gateway.yaml
    - endpoint.env.example
  loop_control:
    label: "otelcol-edge/{{ item }}"
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — deploy wrapper (executable)"
  ansible.builtin.copy:
    src: "{{ role_path }}/files/.config/otelcol-edge/otelcol-edge-run"
    dest: "{{ devbox_otelcol_edge_conf }}/otelcol-edge-run"
    mode: "0755"
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — deploy LaunchAgent plist"
  ansible.builtin.template:
    src: darwin/Library/LaunchAgents/local.otelcol-edge.plist.j2
    dest: "{{ devbox_otelcol_edge_home }}/Library/LaunchAgents/local.otelcol-edge.plist"
    mode: "0644"
  register: devbox_otelcol_edge_plist
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — check installed binary + machine-local endpoint.env"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ devbox_otelcol_edge_bin }}"
    - "{{ devbox_otelcol_edge_endpoint_env }}"
  loop_control:
    label: "{{ item }}"
  register: devbox_otelcol_edge_stats
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — decide whether the service can start"
  # Bootstrap only when the binary is present AND the endpoint is configured.
  # Stat the binary directly (not the get_url result) so a prior-run binary is
  # honoured even when this run's download 404s (release not yet published).
  # The keychain token is checked by the wrapper at runtime (a missing slot is
  # logged there, not here — it can be seeded after the first deploy).
  ansible.builtin.set_fact:
    devbox_otelcol_edge_bin_present: "{{ devbox_otelcol_edge_stats.results[0].stat.exists | default(false) }}"
    devbox_otelcol_edge_endpoint_present: "{{ devbox_otelcol_edge_stats.results[1].stat.exists | default(false) }}"
    devbox_otelcol_edge_ready: >-
      {{ (devbox_otelcol_edge_stats.results[0].stat.exists | default(false))
         and (devbox_otelcol_edge_stats.results[1].stat.exists | default(false)) }}
  when: devbox_packages.otelcol_edge.enabled | default(true)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — report skipped bootstrap (binary or endpoint missing)"
  ansible.builtin.debug:
    msg: >-
      otelcol-edge service not started: {{ 'binary missing (publish the '
      ~ 'otelcol-edge-v' ~ devbox_otelcol_edge_version ~ ' release first)'
      if not (devbox_otelcol_edge_bin_present | bool)
      else 'endpoint.env missing (create it via the local overlay — see '
      ~ 'endpoint.env.example)' }}.
  when:
    - devbox_packages.otelcol_edge.enabled | default(true)
    - not (devbox_otelcol_edge_ready | bool)
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — check LaunchAgent bootstrap status"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - print
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  register: devbox_otelcol_edge_agent_status
  changed_when: false
  failed_when: false
  when:
    - devbox_packages.otelcol_edge.enabled | default(true)
    - devbox_otelcol_edge_ready | bool
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — bootout LaunchAgent (if plist changed and loaded)"
  # bootstrap fails on an already-loaded service; on a plist change we bootout
  # first to pick up the new definition. Mirrors configure_ssh_keychain.yml.
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootout
      - "gui/{{ ansible_facts['user_uid'] }}/local.otelcol-edge"
  when:
    - devbox_packages.otelcol_edge.enabled | default(true)
    - devbox_otelcol_edge_ready | bool
    - devbox_otelcol_edge_plist.changed
    - devbox_otelcol_edge_agent_status.rc == 0
  changed_when: true
  failed_when: false
  tags: [otel, otelcol-edge]

- name: "OpenTelemetry edge — bootstrap LaunchAgent"
  ansible.builtin.command:
    argv:
      - /bin/launchctl
      - bootstrap
      - "gui/{{ ansible_facts['user_uid'] }}"
      - "{{ devbox_otelcol_edge_home }}/Library/LaunchAgents/local.otelcol-edge.plist"
  when:
    - devbox_packages.otelcol_edge.enabled | default(true)
    - devbox_otelcol_edge_ready | bool
    - devbox_otelcol_edge_plist.changed or devbox_otelcol_edge_agent_status.rc != 0
  changed_when: true
  tags: [otel, otelcol-edge]
