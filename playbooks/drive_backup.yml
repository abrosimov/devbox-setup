---
# Fast-path: (re)install the weekly drive backup — the packages/drive-backup uv
# project and its `local.drive-backup` LaunchAgent. Deploys the local overlay
# first, because the overlay's ~/.config/drive-backup/config.toml is what
# switches the backup on.
#
# No sudo, no vault. Invoked via `make drive-backup-push`.

- name: Deploy drive backup
  hosts: 127.0.0.1
  connection: local
  gather_facts: true   # ansible_facts.user_uid addresses the gui/<uid> launchd domain

  vars_files:
    - "../roles/devbox/defaults/main/core.yml"

  tasks:
    - name: Apply local overlay tasks
      ansible.builtin.import_tasks: "../roles/devbox/tasks/install_configs.yml"
      vars:
        role_path: "{{ playbook_dir }}/../roles/devbox"

    - name: Configure drive backup
      ansible.builtin.import_tasks: "../roles/devbox/tasks/darwin/configure_drive_backup.yml"
      vars:
        role_path: "{{ playbook_dir }}/../roles/devbox"
