syntax = "proto3";

// Behaviour log of the Orders implementation for trace validation against
// Orders.tla: one protojson object per line, the oneof member names the spec
// action. The protojson rules that shape TraceOrders.tla are in the tla-plus
// skill §8. `buf breaking` guards this contract on both sides.
package orders.trace.v1;

// One abstract step, written at the commit point of the action.
message Event {
  oneof action {
    Place place = 1;
    Pay pay = 2;
    Ship ship = 3;
  }
  // Optional snapshot of spec variables after the step; narrows the match.
  Snapshot state = 10;
  // Emitting process, distributed deployments only.
  string node = 11;
  // Per-node sequence number.
  uint32 seq = 12;
}

message Place {
  string c = 1;
  int32 item = 2;
}

message Pay {
  string c = 1;
}

message Ship {
  string c = 1;
}

message Snapshot {
  repeated string payments = 1;
  repeated string shipped = 2;
}
