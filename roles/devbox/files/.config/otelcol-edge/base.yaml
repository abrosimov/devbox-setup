# Formula-managed base layer (repo source of truth). Owns local ingestion and
# processing; the gateway endpoint/token/queue/routing live in the sibling
# config.gateway.yaml. Loaded first, before that profile, via two --config args.
#
# Receivers bind to loopback only. resourcedetection does NOT overwrite producer
# attributes (override: false); the deployment.environment.name stamp is fed via
# the `env` detector reading OTEL_RESOURCE_ATTRIBUTES (set per-profile in the
# LaunchAgent plist). Redaction strips credential-like keys/values before export.
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false
  redaction/secrets:
    allow_all_keys: true
    blocked_key_patterns:
      - '(?i).*authorization.*'
      - '(?i).*api[._-]?key.*'
      - '(?i).*cookie.*'
      - '(?i)(^|.*[._-])(access|refresh|auth|secret|bearer)[._-]?token($|[._-].*)'
      - '(?i).*password.*'
    blocked_values:
      - '(?i)Bearer\s+\S+'
      - '(?i)(sk|rk|pk|api)[-_][A-Za-z0-9_-]{12,}'
  batch:
    timeout: 5s
    send_batch_size: 2048
    send_batch_max_size: 4096

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
