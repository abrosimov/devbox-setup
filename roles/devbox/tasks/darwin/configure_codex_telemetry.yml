---
# Inject an [otel] table into the user-owned ~/.codex/config.toml so Codex (CLI +
# app-server/desktop) streams OTLP to the local edge on 127.0.0.1:4317. blockinfile,
# not a deployed file: config.toml holds the user's model/plugins/auth, so we own
# only the marked block. metrics_exporter -> otlp also silences Codex's default
# `statsig` metrics stream to OpenAI. `environment` carries the profile.

- name: "Codex telemetry — locate config.toml"
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
  register: devbox_codex_config
  tags: [otel, codex]

- name: "Codex telemetry — detect existing [otel] and our managed block"
  ansible.builtin.command:
    cmd: "grep -lE '{{ item.pattern }}' {{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
  loop:
    - { key: otel, pattern: '^\[otel\]' }
    # Either marker counts as ours: the block was renamed when the collector
    # moved into the otelbox namespace, and a machine still carrying the old
    # one must be recognised (and cleaned up below), not mistaken for a
    # hand-written [otel] we then refuse to touch.
    - { key: marker, pattern: 'BEGIN devbox (otelcol-edge|otelbox edge) telemetry' }
  loop_control:
    label: "{{ item.key }}"
  register: devbox_codex_greps
  changed_when: false
  failed_when: false
  when: devbox_codex_config.stat.exists
  tags: [otel, codex]

# A hand-written [otel] outside our markers would collide with the block below
# (duplicate TOML table = load error). Only manage the block when either no [otel]
# exists yet, or the one present is already ours.
- name: "Codex telemetry — decide if it is safe to manage the block"
  ansible.builtin.set_fact:
    devbox_codex_manage: >-
      {{ devbox_codex_config.stat.exists
         and (devbox_codex_greps.results[0].rc != 0
              or devbox_codex_greps.results[1].rc == 0) }}
  when: devbox_codex_config.stat.exists
  tags: [otel, codex]

- name: "Codex telemetry — warn on a conflicting hand-written [otel]"
  ansible.builtin.debug:
    msg: >-
      ~/.codex/config.toml already has an [otel] table not managed by devbox —
      leaving it untouched. Remove it to let devbox manage OTLP export.
  when:
    - devbox_codex_config.stat.exists
    - not (devbox_codex_manage | default(false) | bool)
  tags: [otel, codex]

# TRANSITIONAL — delete once every managed workstation has run it. The marker
# was renamed when the collector moved into the otelbox namespace; without this
# step the rename would leave the old block in place and add a second one,
# giving ~/.codex/config.toml two [otel] tables, which is a TOML load error.
- name: "Codex telemetry — drop the legacy otelcol-edge block"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
    marker: "# {mark} devbox otelcol-edge telemetry"
    state: absent
    create: false
  when: devbox_codex_manage | default(false) | bool
  tags: [otel, codex]

- name: "Codex telemetry — inject [otel] block (OTLP gRPC -> local edge)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.codex/config.toml"
    marker: "# {mark} devbox otelbox edge telemetry"
    create: false
    mode: "0600"
    block: |
      [otel]
      environment = "{{ devbox_active_profile }}"
      log_user_prompt = true
      exporter = { otlp-grpc = { endpoint = "http://127.0.0.1:4317" } }
      trace_exporter = { otlp-grpc = { endpoint = "http://127.0.0.1:4317" } }
      metrics_exporter = { otlp-grpc = { endpoint = "http://127.0.0.1:4317" } }
  when: devbox_codex_manage | default(false) | bool
  tags: [otel, codex]
