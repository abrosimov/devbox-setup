[project]
name = "aerospace-layouts"
version = "0.1.0"
description = "awesome-wm-style dynamic tiling layouts scripted on top of the AeroSpace CLI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyobjc-framework-cocoa>=12.2.1",
]

# Standalone uv project, mirroring roles/devbox/files/dot_claude/bin/. Deployed to
# ~/.config/aerospace/layouts/ and materialised with `uv sync --frozen`; AeroSpace
# invokes the built console-script from the deployed .venv. It is intentionally NOT a
# member of the repo dev-tooling workspace so it ships its own pinned .venv.
[project.scripts]
aerospace-layouts = "aerospace_layouts.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100"]
lint = ["ruff>=0.8", "pyrefly>=1.3.0"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C4", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ruff.format]
quote-style = "double"

# Kept in step with packages/drive-backup/, the repo's other standalone uv project:
# the strict preset plus the explicit-annotation checks the preset leaves opt-in.
[tool.pyrefly]
python-version = "3.13"
project-includes = ["src", "tests"]
# `.` makes the tests package (and its `from .conftest import ...`) resolvable.
search-path = ["src", "."]
project-excludes = ["**/.venv/**", "**/__pycache__/**"]
preset = "strict"
check-unannotated-defs = true
infer-return-types = "checked"
strict-callable-subtyping = true

[tool.pyrefly.errors]
implicit-any = true
implicit-any-parameter = true
unannotated-return = true
bad-override = true
unbound-name = true
missing-override-decorator = true
unused-ignore = true

# Tests hold ruff's `ANN` per-file-ignore (above), so demanding `-> None` on every test
# would contradict that decision; the former pyright strict config did not ask for it
# either. Every other strict check still applies to tests.
[[tool.pyrefly.sub-config]]
matches = "tests/**"
[tool.pyrefly.sub-config.errors]
unannotated-return = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = [
    "live: smoke tests that drive the real AeroSpace WM; skipped unless AEROSPACE_LAYOUTS_LIVE=1",
]
